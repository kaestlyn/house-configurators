<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Porch Elevation Tool</title>
<style>
  :root {
    --paper:#F4F2EE; --sunk:#EAE6E0; --ink:#26201D; --muted:#766C66;
    --line:#DCD6CD; --accent:#9E4A38; --ok:#3F6B47; --warn:#8A6A21;
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:#191614; --sunk:#14110F; --ink:#EDE7E1; --muted:#A0968E;
      --line:#37312C; --accent:#D5826A; --ok:#7FB08A; --warn:#C9A44E;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink);
         font-family:var(--sans); font-size:15px; line-height:1.55; }
  .wrap { max-width:1180px; margin:0 auto; padding:20px 24px 60px; }

  nav.tools {
    display:flex; gap:2px; border-bottom:1px solid var(--line);
    background:var(--sunk); padding:0 24px;
  }
  nav.tools a {
    font-family:var(--mono); font-size:11.5px; letter-spacing:0.06em; text-transform:uppercase;
    color:var(--muted); text-decoration:none; padding:13px 14px;
    border-bottom:2px solid transparent;
  }
  nav.tools a:hover { color:var(--ink); }
  nav.tools a.active { color:var(--accent); border-bottom-color:var(--accent); }

  h1 { font-size:26px; margin:0 0 6px; font-weight:600; letter-spacing:-0.01em; }
  .sub { color:var(--muted); margin:0 0 28px; max-width:64ch; }
  code { font-family:var(--mono); font-size:0.92em; background:var(--sunk); padding:1px 5px; border-radius:3px; }

  .tabbar { display:flex; gap:4px; margin:24px 0 0; border-bottom:1px solid var(--line); }
  .tabbar button {
    font-family:var(--mono); font-size:11px; font-weight:500; letter-spacing:0.1em;
    text-transform:uppercase; padding:10px 14px; margin-bottom:-1px; cursor:pointer;
    background:none; border:none; border-bottom:2px solid transparent; color:var(--muted);
  }
  .tabbar button:hover { color:var(--ink); }
  .tabbar button.active { color:var(--accent); border-bottom-color:var(--accent); }

  .panel { background:var(--sunk); border:1px solid var(--line); border-top:none; padding:20px 22px; margin-bottom:14px; }
  .tabpanel { display:none; }
  .tabpanel.active { display:block; }
  .panel h2 { font-family:var(--mono); font-size:11px; font-weight:500; letter-spacing:0.14em;
              text-transform:uppercase; color:var(--accent); margin:0 0 14px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px 18px; }
  label { display:flex; flex-direction:column; gap:4px; font-size:12.5px; color:var(--muted); }
  label span { font-family:var(--mono); letter-spacing:0.04em; text-transform:uppercase; font-size:10.5px; }
  input[type=number], select {
    font-family:var(--mono); font-size:14px; padding:6px 8px;
    background:var(--paper); color:var(--ink);
    border:1px solid var(--line); border-radius:3px; width:100%;
  }
  label.check { flex-direction:row; align-items:center; gap:8px; font-size:13px; }
  input[type=checkbox] { width:16px; height:16px; accent-color:var(--accent); }

  .swatches { display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:12px 18px; margin-top:16px; }
  .swatch { display:flex; flex-direction:column; gap:4px; font-size:12.5px; color:var(--muted); }
  .swatch span { font-family:var(--mono); letter-spacing:0.04em; text-transform:uppercase; font-size:10.5px; }
  input[type=color] {
    width:100%; height:30px; padding:2px; background:var(--paper);
    border:1px solid var(--line); border-radius:3px; cursor:pointer;
  }
  .swatch select.copyfrom {
    font-size:10.5px; padding:3px 4px; margin-top:2px;
  }

  .checks { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:10px 20px; }
  .chk { font-family:var(--mono); font-size:12.5px; line-height:1.5; display:flex; gap:8px; align-items:baseline; }
  .chk .dot { width:8px; height:8px; border-radius:50%; flex:none; margin-top:5px; }
  .chk.ok .dot { background:var(--ok); }
  .chk.warn .dot { background:var(--warn); }
  .chk b { font-weight:600; }
  .chk .lbl { color:var(--muted); }

  #out .scheme { margin-top:0; }
  .shead { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:8px; }
  .shead h3 { margin:0; font-size:18px; font-weight:600; }
  .shead .mat { font-family:var(--mono); font-size:11.5px; color:var(--muted); letter-spacing:0.04em; }
  .shead .actions { margin-left:auto; display:flex; gap:8px; }
  .shead button { font-family:var(--mono); font-size:11px; letter-spacing:0.08em;
    text-transform:uppercase; padding:5px 11px; cursor:pointer;
    background:var(--paper); color:var(--ink); border:1px solid var(--line); border-radius:3px; }
  .shead button:hover { border-color:var(--accent); color:var(--accent); }
  .art { background:var(--sunk); border:1px solid var(--line); line-height:0; overflow:hidden; }
  .art svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<nav class="tools">
  <a href="garage-elevation-tool.html">Garage</a>
  <a href="porch-elevation-tool.html" class="active">Porch</a>
</nav>
<div class="wrap">

  <!-- Same idea as the garage file — everything comes from the CONFIG
       object at the top of the script. The door fills its bay; the landing
       is sized in bay-widths; the stairs are a percentage of the landing
       and can sit left, centre or right. Steps are drawn end-on. -->

  <div id="out"></div>

  <div class="tabbar">
    <button type="button" class="active" data-tab="tabPorch">Porch</button>
    <button type="button" data-tab="tabDoor">Door, landing &amp; steps</button>
    <button type="button" data-tab="tabAppearance">Appearance</button>
    <button type="button" data-tab="tabChecks">Checks</button>
  </div>

  <div class="panel tabpanel active" id="tabPorch">
    <div class="grid" id="ctlPorch"></div>
  </div>

  <div class="panel tabpanel" id="tabDoor">
    <div class="grid" id="ctlDoor"></div>
  </div>

  <div class="panel tabpanel" id="tabAppearance">
    <div class="grid" id="ctlAppearance"></div>
    <div class="swatches" id="ctlColors"></div>
  </div>

  <div class="panel tabpanel" id="tabChecks">
    <div class="checks" id="checks"></div>
  </div>
</div>

<script>
"use strict";

/* ===================================================================
   CONFIG — feet unless the name says inches or percent.
   =================================================================== */

const CONFIG = {
  bays:              4,     // bays drawn (the real porch has ~10)
  bayWidthFt:        4.6,   // nominal clear width; sets the total run. The door
                             // bay is pinned to doorWidthFt, the rest split what's left evenly
  postSizeIn:        5.5,   // 6x6 actual
  openingHeightFt:   7,     // deck to underside of header
  railHeightFt:      3.4,   // deck to top of handrail
  deckAboveGradeFt:  2.5,   // deck surface above grade
  transomTallFt:     2.3,   // transom height at the house end
  transomShortFt:    1.0,   // transom height at the far end

  showDoor:          true,
  doorBay:           4,     // 1-based; the door fills this bay
  doorWidthFt:       3,     // the door bay is pinned to this width
  doorSwingOut:      true,

  landingBays:       1.5,   // 1, 1.5 or 2 bay widths
  stairPct:          70,    // stair width as a % of landing width
  stairAlign:        "center",  // "left" | "center" | "right"
  riserInches:       7,

  pxPerFt:           34,

  // appearance — a starting palette, freely editable below
  colors: { post:"#8B5A2E", beam:"#8B5A2E", rail:"#8B5A2E", spindle:"#7E5029",
            floor:"#6F4522", skirt:"#8B5A2E", skirtbg:"#3A2A1B", interior:"#2F2C28" }
};

/* Pre-configured color palettes. Any of these can be loaded, then tweaked
   freely via the swatches below. */

const PALETTES = [
  { name:"As it stands", c:{
      post:"#8B5A2E", beam:"#8B5A2E", rail:"#8B5A2E", spindle:"#7E5029",
      floor:"#6F4522", skirt:"#8B5A2E", skirtbg:"#3A2A1B", interior:"#2F2C28" } },
  { name:"Trim white, dark floor", c:{
      post:"#EFEBE2", beam:"#EFEBE2", rail:"#EFEBE2", spindle:"#EFEBE2",
      floor:"#3B3430", skirt:"#EFEBE2", skirtbg:"#2A2522", interior:"#2E2C29" } },
  { name:"Charcoal throughout", c:{
      post:"#343230", beam:"#343230", rail:"#343230", spindle:"#2C2A28",
      floor:"#2A2724", skirt:"#343230", skirtbg:"#1E1C1A", interior:"#242220" } },
  { name:"White frame, black rail", c:{
      post:"#EFEBE2", beam:"#EFEBE2", rail:"#EFEBE2", spindle:"#2C2A27",
      floor:"#3B3430", skirt:"#EFEBE2", skirtbg:"#2A2522", interior:"#2E2C29" } }
];

const COLOR_ROLES = [
  ["post",     "Posts"],
  ["beam",     "Beam / header"],
  ["rail",     "Rail"],
  ["spindle",  "Spindles"],
  ["floor",    "Floor / treads"],
  ["skirt",    "Skirt trim"],
  ["skirtbg",  "Skirt background"],
  ["interior", "Interior (screen)"]
];

/* Bay widths in feet: normally uniform, but the door bay is pinned to
   cfg.doorWidthFt and the rest of the run splits evenly across the other
   bays. Shared by geometry() (px) and runChecks() (ft) so both agree. */
function bayWidthsFt(cfg) {
  const doorBayIdx = cfg.showDoor ? Math.min(cfg.doorBay, cfg.bays) - 1 : -1;
  const doorWFt = cfg.doorWidthFt;
  const totalClearFt = cfg.bays * cfg.bayWidthFt;
  const otherCount = doorBayIdx >= 0 ? cfg.bays - 1 : cfg.bays;
  const otherWFt = otherCount > 0
    ? (totalClearFt - (doorBayIdx >= 0 ? doorWFt : 0)) / otherCount
    : totalClearFt;
  const widths = [];
  for (let i = 0; i < cfg.bays; i++) widths.push(i === doorBayIdx ? doorWFt : otherWFt);
  return { widths, doorBayIdx, doorWFt };
}

/* ===================================================================
   Geometry
   =================================================================== */

function geometry(cfg) {
  const S = cfg.pxPerFt;
  const ft = f => f * S;
  const inch = i => (i / 12) * S;

  const PW = inch(cfg.postSizeIn);
  const houseW = ft(3.2);
  const x0 = houseW;                                  // face of the first post

  const { widths: bayWidthsFtArr, doorBayIdx } = bayWidthsFt(cfg);
  const bayWidths = bayWidthsFtArr.map(ft);
  const porchW = bayWidths.reduce((a, b) => a + b, 0) + (cfg.bays + 1) * PW;
  const x1 = x0 + porchW;

  const topPad = ft(0.5);
  const roofBand = ft(0.55);
  const headerH = ft(0.75);

  // vertical stack, worked down from the tallest point
  const roofTopL = topPad;
  const headerTopY = roofTopL + roofBand + ft(cfg.transomTallFt);
  const headerBotY = headerTopY + headerH;
  const deckTopY = headerBotY + ft(cfg.openingHeightFt);
  const deckFasciaH = ft(0.62);
  const groundY = deckTopY + ft(cfg.deckAboveGradeFt);
  const skirtTopY = deckTopY + deckFasciaH;

  const railTopY = deckTopY - ft(cfg.railHeightFt);
  const railTopH = ft(0.45);
  const railBotY = deckTopY - ft(0.78);
  const railBotH = ft(0.42);

  // rake: roof underside falls from the house end to the far end
  const rakeL = headerTopY - ft(cfg.transomTallFt);
  const rakeR = headerTopY - ft(cfg.transomShortFt);
  const rakeY = x => rakeL + (x - x0) * ((rakeR - rakeL) / (x1 - x0));

  // posts and bays, built cumulatively since bay widths may differ
  const posts = [x0], bays = [];
  for (let i = 0; i < cfg.bays; i++) {
    const a = posts[i] + PW;
    bays.push([a, a + bayWidths[i]]);
    posts.push(a + bayWidths[i]);
  }

  const W = x1 + ft(1.4);
  const H = groundY + ft(1.5);

  return { S, ft, inch, PW, bayWidths, doorBayIdx, x0, x1, posts, bays, rakeY,
           roofTopL, roofBand, headerTopY, headerBotY, headerH,
           deckTopY, deckFasciaH, skirtTopY, groundY,
           railTopY, railTopH, railBotY, railBotH, W, H };
}

/* landing and stair extents, in px. "1 bay" is just the door bay; "1.5"
   and "2" extend the landing into the real neighboring bay by that
   fraction, rather than a multiple of the door's own width — so the extra
   size reflects the actual (usually wider) bay next door. */
function stairLayout(cfg, g) {
  if (!cfg.showDoor) return null;
  const idx = g.doorBayIdx;
  const bay = g.bays[idx];

  // extend toward the bay before the door (the porch interior) when one
  // exists, otherwise the bay after — a single-bay porch has no neighbor
  const hasLeft = idx > 0, hasRight = idx < g.bays.length - 1;
  const neighborIdx = hasLeft ? idx - 1 : (hasRight ? idx + 1 : -1);
  const neighborW = neighborIdx >= 0 ? (g.bays[neighborIdx][1] - g.bays[neighborIdx][0]) : 0;
  const extraFrac = Math.max(0, Math.min(1, cfg.landingBays - 1));

  let la, lb;
  if (neighborIdx === idx - 1) {
    lb = bay[1];
    la = bay[0] - extraFrac * neighborW;
  } else if (neighborIdx === idx + 1) {
    la = bay[0];
    lb = bay[1] + extraFrac * neighborW;
  } else {
    la = bay[0]; lb = bay[1];
  }

  const landW = lb - la;
  const cx = (la + lb) / 2;

  const stairW = landW * (cfg.stairPct / 100);
  let sa;
  if (cfg.stairAlign === "left") sa = la;
  else if (cfg.stairAlign === "right") sa = lb - stairW;
  else sa = cx - stairW / 2;

  return { bay, cx, la, lb, landW, sa, sb: sa + stairW, stairW };
}

/* ===================================================================
   Drawing
   =================================================================== */

const rect = (x, y, w, h, f) =>
  `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}"/>`;
const poly = (pts, f) => `<polygon points="${pts}" fill="${f}"/>`;

/* balusters filling a run, ~4" gaps */
function balusters(a, b, top, bottom, g) {
  const bw = g.inch(1.6), gap = g.inch(3.9);
  let s = "";
  for (let x = a + gap; x + bw < b - gap * 0.4; x += bw + gap) {
    s += rect(x, top, bw, bottom - top, "var(--spindle)");
  }
  return s;
}

/* screen door filling its whole bay */
function screenDoor(bay, g, cfg) {
  const a = bay[0], w = bay[1] - bay[0];
  const top = g.headerBotY, h = g.deckTopY - top;
  const st = g.inch(4.5);                 // stile / rail width
  const kick = g.ft(1.5);                 // solid panel at the bottom
  let s = rect(a, top, w, h, "var(--interior)");
  s += rect(a, top, w, h, "rgba(140,150,145,0.10)");

  s += rect(a, top, st, h, "var(--rail)");
  s += rect(a + w - st, top, st, h, "var(--rail)");
  s += rect(a, top, w, st, "var(--rail)");
  s += rect(a, g.deckTopY - st, w, st, "var(--rail)");
  s += rect(a, g.deckTopY - kick - st, w, st, "var(--rail)");
  s += rect(a + st, g.deckTopY - kick, w - st * 2, kick - st, "var(--rail)");
  s += rect(a + st, g.deckTopY - kick, w - st * 2, 2, "rgba(0,0,0,0.20)");

  // hinge side and handle follow the swing
  const hx = cfg.doorSwingOut ? a + w - st * 2.2 : a + st * 1.4;
  s += rect(hx, g.deckTopY - kick - g.ft(1.1), g.inch(1.6), g.inch(7), "rgba(0,0,0,0.45)");
  return s;
}

/* landing and steps, seen end-on */
function landingSteps(L, g, cfg) {
  const LT = g.deckTopY + g.inch(2);          // landing sits a touch below the threshold
  const LF = g.ft(0.66);                       // landing fascia
  const n = Math.max(1, Math.round((cfg.deckAboveGradeFt * 12) / cfg.riserInches));
  const stepH = (g.groundY - (LT + LF)) / n;
  // each tread a little wider as it nears you, but never past the landing edges
  const grow = Math.min(g.inch(4), Math.max(0, L.landW - L.stairW));
  const RH = g.ft(2.9);                        // guard height
  let s = "";

  // shadow on the skirt behind
  s += rect(L.la - 6, LT, L.landW + 12, g.groundY - LT, "rgba(0,0,0,0.30)");

  // landing
  s += rect(L.la, LT, L.landW, LF, "var(--floor)");
  s += rect(L.la, LT, L.landW, LF, "rgba(255,255,255,0.12)");
  s += rect(L.la, LT, L.landW, 5, "rgba(255,255,255,0.32)");
  s += rect(L.la, LT + LF - 3, L.landW, 3, "rgba(0,0,0,0.34)");

  // steps
  for (let i = 0; i < n; i++) {
    const w = L.stairW + grow * (i / Math.max(1, n - 1));
    const cxS = (L.sa + L.sb) / 2;
    const y = LT + LF + i * stepH;
    s += rect(cxS - w / 2, y, w, stepH, "var(--floor)");
    s += rect(cxS - w / 2, y, w, stepH, "rgba(255,255,255,0.12)");
    s += rect(cxS - w / 2, y, w, 4.5, "rgba(255,255,255,0.32)");
    s += rect(cxS - w / 2, y + stepH - 3, w, 3, "rgba(0,0,0,0.34)");
  }

  // guard across the parts of the landing the stairs don't use
  [[L.la, L.sa], [L.sb, L.lb]].forEach(seg => {
    const w = seg[1] - seg[0];
    if (w < g.inch(4)) return;
    s += rect(seg[0], LT - RH, w, g.inch(2.6), "var(--rail)");
    s += rect(seg[0], LT - g.ft(0.5), w, g.inch(2.2), "var(--rail)");
    s += balusters(seg[0], seg[1], LT - RH + g.inch(2.6), LT - g.ft(0.5), g);
  });

  // newels at the landing corners and either side of the steps
  [L.la, L.lb, L.sa, L.sb].forEach(x => {
    const nw = g.inch(4.5);
    s += rect(x - nw / 2, LT - RH - g.inch(2), nw, RH + g.inch(2), "var(--rail)");
    s += rect(x - nw / 2 - 3, LT - RH - g.inch(5), nw + 6, g.inch(3.4), "var(--rail)");
  });

  // stair guards running down beside the steps
  [-1, 1].forEach(k => {
    const xTop = k < 0 ? L.sa : L.sb;
    const cxS = (L.sa + L.sb) / 2;
    const xBot = cxS + k * ((L.stairW + grow) / 2);
    const bw = g.inch(3.6);
    s += rect(xBot - bw / 2, g.groundY - RH, bw, RH, "var(--rail)");
    s += poly(
      `${xTop + k * bw / 2},${LT - RH} ${xBot + k * bw / 2},${g.groundY - RH} ` +
      `${xBot - k * bw / 2},${g.groundY - RH + g.inch(2.8)} ${xTop - k * bw / 2},${LT - RH + g.inch(2.8)}`,
      "var(--rail)");
    for (let t = 0.3; t < 0.95; t += 0.32) {
      const bx = xTop + (xBot - xTop) * t;
      const byT = (LT - RH) + ((g.groundY - RH) - (LT - RH)) * t;
      const byB = (LT + LF) + (g.groundY - (LT + LF)) * t;
      s += rect(bx - g.inch(0.9), byT + g.inch(2.8), g.inch(1.8), byB - byT - g.inch(2.8), "var(--spindle)");
    }
  });

  return s;
}

function drawPorch(cfg, uid) {
  const g = geometry(cfg);
  const L = stairLayout(cfg, g);
  const doorIdx = cfg.showDoor ? Math.min(cfg.doorBay, cfg.bays) - 1 : -1;

  // a landing that runs past the porch corner still has to fit in the frame
  if (L) g.W = Math.max(g.W, L.lb + g.ft(1.2));

  let s = "";

  // diamond lattice: a plain crosshatch grid, rotated 45deg by the pattern
  // itself so the strips read as diamonds rather than a square grid
  const latP = g.inch(3.6), latSW = g.inch(0.85);

  s += `<defs>
    <pattern id="bk${uid}" width="46" height="15" patternUnits="userSpaceOnUse">
      <rect width="46" height="15" fill="#A5503C"/>
      <rect width="46" height="2" y="13" fill="#8B4231"/>
      <rect width="2" height="15" fill="#8B4231"/>
      <rect width="2" height="15" x="23" fill="#9A4A37"/>
    </pattern>
    <pattern id="lat${uid}" width="${latP}" height="${latP}" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="${latP}" stroke="var(--skirt)" stroke-width="${latSW}"/>
      <line x1="0" y1="0" x2="${latP}" y2="0" stroke="var(--skirt)" stroke-width="${latSW}"/>
    </pattern>
    <clipPath id="op${uid}"><polygon points="${g.x0},${g.rakeY(g.x0)} ${g.x1},${g.rakeY(g.x1)} ${g.x1},${g.deckTopY} ${g.x0},${g.deckTopY}"/></clipPath>
  </defs>`;

  // sky, ground, house wall
  s += rect(0, 0, g.W, g.groundY, "var(--sky)");
  s += rect(0, g.groundY, g.W, g.H - g.groundY, "var(--grass)");
  s += rect(0, 0, g.x0, g.groundY, `url(#bk${uid})`);
  s += rect(g.x0 - 6, 0, 6, g.groundY, "rgba(0,0,0,0.16)");

  // porch interior seen through the screen
  s += `<g clip-path="url(#op${uid})">`;
  s += rect(g.x0, 0, g.x1 - g.x0, g.deckTopY, "var(--interior)");
  s += rect(g.x0, 0, g.x1 - g.x0, g.deckTopY, "rgba(140,150,145,0.13)");
  s += "</g>";

  // shed roof: shingle sliver over a white fascia, following the rake
  const rl = g.rakeY(g.x0 - g.ft(0.4)), rr = g.rakeY(g.x1 + g.ft(0.4));
  const RB = g.roofBand;
  s += poly(`${g.x0 - g.ft(0.4)},${rl - RB - g.ft(0.32)} ${g.x1 + g.ft(0.4)},${rr - RB - g.ft(0.32)} ${g.x1 + g.ft(0.4)},${rr - RB} ${g.x0 - g.ft(0.4)},${rl - RB}`, "#31302E");
  s += poly(`${g.x0 - g.ft(0.4)},${rl - RB} ${g.x1 + g.ft(0.4)},${rr - RB} ${g.x1 + g.ft(0.4)},${rr} ${g.x0 - g.ft(0.4)},${rl}`, "#F1EDE5");
  s += poly(`${g.x0 - g.ft(0.4)},${rl - 4} ${g.x1 + g.ft(0.4)},${rr - 4} ${g.x1 + g.ft(0.4)},${rr} ${g.x0 - g.ft(0.4)},${rl}`, "rgba(0,0,0,0.14)");

  // transom dividers, mid-bay
  g.bays.forEach(b => {
    const x = (b[0] + b[1]) / 2 - g.inch(2);
    s += rect(x, g.rakeY(x), g.inch(4), g.headerTopY - g.rakeY(x), "var(--beam)");
  });

  // header beam
  s += rect(g.x0, g.headerTopY, g.x1 - g.x0, g.headerH, "var(--beam)");
  s += rect(g.x0, g.headerBotY - 3, g.x1 - g.x0, 3, "rgba(0,0,0,0.17)");

  // rails, interrupted at the door bay
  const runs = doorIdx < 0
    ? [[g.x0, g.x1]]
    : [[g.x0, g.bays[doorIdx][0] - g.PW], [g.bays[doorIdx][1] + g.PW, g.x1]];
  runs.forEach(run => {
    const w = run[1] - run[0];
    if (w <= 0) return;
    s += rect(run[0], g.railTopY, w, g.railTopH, "var(--rail)");
    s += rect(run[0], g.railTopY + g.railTopH - 3, w, 3, "rgba(0,0,0,0.15)");
    s += rect(run[0], g.railBotY, w, g.railBotH, "var(--rail)");
  });

  // spindles
  g.bays.forEach((b, i) => {
    if (i === doorIdx) return;
    s += balusters(b[0], b[1], g.railTopY + g.railTopH, g.railBotY, g);
  });

  if (doorIdx >= 0) s += screenDoor(g.bays[doorIdx], g, cfg);

  // posts
  g.posts.forEach(x => {
    const top = g.rakeY(x + g.PW / 2);
    s += rect(x, top, g.PW, g.deckTopY - top, "var(--post)");
    s += rect(x + g.PW - 4, top, 4, g.deckTopY - top, "rgba(0,0,0,0.14)");
  });

  // deck band
  s += rect(g.x0, g.deckTopY, g.x1 - g.x0, g.deckFasciaH, "var(--floor)");
  s += rect(g.x0, g.deckTopY, g.x1 - g.x0, 3, "rgba(255,255,255,0.16)");

  // skirt: diamond lattice panel per bay, framed
  s += rect(g.x0, g.skirtTopY, g.x1 - g.x0, g.groundY - g.skirtTopY, "var(--skirtbg)");
  g.bays.forEach((b, i) => {
    if (i === doorIdx) return;
    const a = b[0] + 6, c = b[1] - 6, t = g.skirtTopY + 6, u = g.groundY - 6;
    s += rect(a, t, c - a, u - t, `url(#lat${uid})`);
    s += rect(a, t, c - a, g.inch(2), "var(--skirt)");
    s += rect(a, u - g.inch(2), c - a, g.inch(2), "var(--skirt)");
    s += rect(a, t, g.inch(2), u - t, "var(--skirt)");
    s += rect(c - g.inch(2), t, g.inch(2), u - t, "var(--skirt)");
  });
  g.posts.forEach(x => s += rect(x, g.skirtTopY, g.PW, g.groundY - g.skirtTopY, "var(--skirt)"));
  s += rect(g.x0, g.groundY - 4, g.x1 - g.x0, 4, "rgba(0,0,0,0.25)");

  if (L) s += landingSteps(L, g, cfg);

  const site = { sky:"#CBD8DF", grass:"#8C9A72" };
  const vars = Object.entries({ ...cfg.colors, ...site }).map(([k, v]) => `--${k}:${v}`).join(";");
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${Math.round(g.W)} ${Math.round(g.H)}" style="${vars}">${s}</svg>`;
}

/* ===================================================================
   Checks
   =================================================================== */

function runChecks(cfg) {
  const out = [];
  const { widths, doorBayIdx } = bayWidthsFt(cfg);

  if (cfg.showDoor) {
    const doorFt = widths[doorBayIdx];

    // the landing extends into the real neighboring bay, not a multiple of
    // the door's own width — same rule as stairLayout()
    const hasLeft = doorBayIdx > 0, hasRight = doorBayIdx < cfg.bays - 1;
    const neighborIdx = hasLeft ? doorBayIdx - 1 : (hasRight ? doorBayIdx + 1 : -1);
    const neighborFt = neighborIdx >= 0 ? widths[neighborIdx] : 0;
    const extraFrac = Math.max(0, Math.min(1, cfg.landingBays - 1));
    const landFt = doorFt + extraFrac * neighborFt;
    const stairFt = landFt * (cfg.stairPct / 100);

    if (neighborIdx < 0 && extraFrac > 0) {
      out.push({ ok: false, label: "Landing extension",
        value: "no neighbor bay — capped to door width" });
    }

    const sideFt = (landFt - doorFt) / 2;
    out.push({ ok: landFt >= doorFt,
      label: "Landing beyond door",
      value: sideFt > 0 ? `${(sideFt * 12).toFixed(0)}" into next bay` : "flush with door" });

    out.push({ ok: stairFt >= 3, label: "Stair width", value: `${stairFt.toFixed(1)}'` });

    const inset = landFt - stairFt;
    out.push({ ok: inset >= 1,
      label: "Landing beyond stairs",
      value: `${(inset * 12).toFixed(0)}" total` });

    const risers = Math.max(1, Math.round((cfg.deckAboveGradeFt * 12) / cfg.riserInches));
    const rh = (cfg.deckAboveGradeFt * 12) / risers;
    out.push({ ok: rh >= 4 && rh <= 7.75,
      label: `Riser height (${risers} risers)`, value: `${rh.toFixed(2)}"` });
  }

  out.push({ ok: true, label: "Porch width drawn",
    value: `${(cfg.bays * cfg.bayWidthFt + (cfg.bays + 1) * cfg.postSizeIn / 12).toFixed(1)}'` });

  return out;
}

/* ===================================================================
   UI
   =================================================================== */

const FIELDS_PORCH = [
  ["bays", "Bays drawn", 1, 12, 1],
  ["bayWidthFt", "Bay width, avg (ft)", 2, 12, 0.1],
  ["postSizeIn", "Post size (in)", 3, 12, 0.5],
  ["openingHeightFt", "Opening height (ft)", 4, 12, 0.1],
  ["railHeightFt", "Rail height (ft)", 2.5, 4.5, 0.1],
  ["deckAboveGradeFt", "Deck above grade (ft)", 0.5, 8, 0.25],
  ["transomTallFt", "Transom, house end (ft)", 0, 6, 0.1],
  ["transomShortFt", "Transom, far end (ft)", 0, 6, 0.1],
  ["pxPerFt", "Scale (px/ft)", 10, 60, 1]
];

const FIELDS_DOOR = [
  ["doorBay", "Door in bay #", 1, 12, 1],
  ["doorWidthFt", "Door width (ft)", 2, 6, 0.5],
  ["stairPct", "Stairs (% of landing)", 20, 100, 5],
  ["riserInches", "Riser (in)", 4, 8, 0.25]
];

function buildNumbers(hostId, fields) {
  const host = document.getElementById(hostId);
  fields.forEach(([key, label, min, max, step]) => {
    const l = document.createElement("label");
    l.innerHTML = `<span>${label}</span>`;
    const inp = document.createElement("input");
    inp.type = "number"; inp.min = min; inp.max = max; inp.step = step;
    inp.value = CONFIG[key];
    inp.addEventListener("input", () => {
      const v = parseFloat(inp.value);
      if (!Number.isNaN(v)) { CONFIG[key] = v; render(); }
    });
    l.appendChild(inp); host.appendChild(l);
  });
}

function buildSelect(hostId, key, label, options) {
  const host = document.getElementById(hostId);
  const l = document.createElement("label");
  l.innerHTML = `<span>${label}</span>`;
  const sel = document.createElement("select");
  options.forEach(([v, t]) => {
    const o = document.createElement("option");
    o.value = v; o.textContent = t;
    if (String(CONFIG[key]) === String(v)) o.selected = true;
    sel.appendChild(o);
  });
  sel.addEventListener("change", () => {
    const n = parseFloat(sel.value);
    CONFIG[key] = Number.isNaN(n) ? sel.value : n;
    render();
  });
  l.appendChild(sel); host.appendChild(l);
}

function buildToggle(hostId, key, label) {
  const host = document.getElementById(hostId);
  const l = document.createElement("label");
  l.className = "check";
  const inp = document.createElement("input");
  inp.type = "checkbox"; inp.checked = CONFIG[key];
  inp.addEventListener("change", () => { CONFIG[key] = inp.checked; render(); });
  l.appendChild(inp); l.appendChild(document.createTextNode(label));
  host.appendChild(l);
}

function buildAppearanceControls() {
  const host = document.getElementById("ctlAppearance");

  const paletteLabel = document.createElement("label");
  paletteLabel.innerHTML = `<span>Color palette</span>`;
  const paletteSel = document.createElement("select");
  paletteSel.innerHTML = `<option value="">Custom</option>` +
    PALETTES.map((p, i) => `<option value="${i}">${p.name}</option>`).join("");
  paletteSel.addEventListener("change", () => {
    if (paletteSel.value === "") return;
    CONFIG.colors = { ...PALETTES[+paletteSel.value].c };
    refreshColorInputs();
    render();
  });
  paletteLabel.appendChild(paletteSel);
  host.appendChild(paletteLabel);

  // matching a palette exactly re-selects it in the dropdown; editing any
  // swatch afterward falls back to "Custom"
  window._syncPaletteSelect = () => {
    const idx = PALETTES.findIndex(p =>
      COLOR_ROLES.every(([key]) => p.c[key] === CONFIG.colors[key]));
    paletteSel.value = idx === -1 ? "" : String(idx);
  };
  window._syncPaletteSelect();
}

function refreshColorInputs() {
  COLOR_ROLES.forEach(([key]) => {
    const inp = document.getElementById("clr-" + key);
    if (inp) inp.value = CONFIG.colors[key];
  });
  if (window._syncPaletteSelect) window._syncPaletteSelect();
}

function buildColorControls() {
  const host = document.getElementById("ctlColors");
  COLOR_ROLES.forEach(([key, label]) => {
    const l = document.createElement("label");
    l.className = "swatch";
    l.innerHTML = `<span>${label}</span>`;
    const inp = document.createElement("input");
    inp.type = "color";
    inp.id = "clr-" + key;
    inp.value = CONFIG.colors[key];
    inp.addEventListener("input", () => {
      CONFIG.colors[key] = inp.value;
      if (window._syncPaletteSelect) window._syncPaletteSelect();
      render();
    });
    l.appendChild(inp);

    // "copy from" — pick another role to pull its current color into this one
    const copy = document.createElement("select");
    copy.className = "copyfrom";
    copy.innerHTML = `<option value="">Copy from…</option>` +
      COLOR_ROLES.filter(([k]) => k !== key)
        .map(([k, lbl]) => `<option value="${k}">${lbl}</option>`).join("");
    copy.addEventListener("change", () => {
      if (!copy.value) return;
      CONFIG.colors[key] = CONFIG.colors[copy.value];
      inp.value = CONFIG.colors[key];
      copy.value = "";
      if (window._syncPaletteSelect) window._syncPaletteSelect();
      render();
    });
    l.appendChild(copy);

    host.appendChild(l);
  });
}

function saveSVG(markup, name) {
  const blob = new Blob([markup], { type: "image/svg+xml" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* Share links — the whole CONFIG, packed into a URL-safe base64 blob in
   the "c" query param, so a link fully reproduces the configuration. */
function encodeConfig(cfg) {
  const json = JSON.stringify(cfg);
  return btoa(unescape(encodeURIComponent(json)))
    .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function decodeConfig(str) {
  try {
    let b64 = str.replace(/-/g, "+").replace(/_/g, "/");
    while (b64.length % 4) b64 += "=";
    return JSON.parse(decodeURIComponent(escape(atob(b64))));
  } catch (e) { return null; }
}
function loadFromURL() {
  const c = new URLSearchParams(location.search).get("c");
  if (!c) return;
  const parsed = decodeConfig(c);
  if (parsed) Object.assign(CONFIG, parsed);
}
function updateURL() {
  const url = new URL(location.href);
  url.searchParams.set("c", encodeConfig(CONFIG));
  history.replaceState(null, "", url);
}

function render() {
  document.getElementById("checks").innerHTML = runChecks(CONFIG).map(c =>
    `<div class="chk ${c.ok ? "ok" : "warn"}"><span class="dot"></span>` +
    `<span><span class="lbl">${c.label}</span> <b>${c.value}</b></span></div>`).join("");

  const out = document.getElementById("out");
  out.innerHTML = "";
  const svg = drawPorch(CONFIG, "p0");
  const wrap = document.createElement("div");
  wrap.className = "scheme";
  wrap.innerHTML =
    `<div class="shead"><h3>Elevation</h3>` +
    `<div class="actions">` +
    `<button type="button" class="save">Save SVG</button>` +
    `<button type="button" class="share">Copy link</button>` +
    `</div></div><div class="art">${svg}</div>`;
  wrap.querySelector(".save").addEventListener("click", () =>
    saveSVG(svg, "porch-elevation.svg"));
  const shareBtn = wrap.querySelector(".share");
  shareBtn.addEventListener("click", () => {
    updateURL();
    navigator.clipboard.writeText(location.href).then(() => {
      const orig = shareBtn.textContent;
      shareBtn.textContent = "Copied!";
      setTimeout(() => { shareBtn.textContent = orig; }, 1200);
    });
  });
  out.appendChild(wrap);

  updateURL();
}

loadFromURL();
buildNumbers("ctlPorch", FIELDS_PORCH);
buildNumbers("ctlDoor", FIELDS_DOOR);
buildSelect("ctlDoor", "landingBays", "Landing size",
  [[1, "1 bay"], [1.5, "1.5 bays"], [2, "2 bays"]]);
buildSelect("ctlDoor", "stairAlign", "Stair alignment",
  [["center", "Center"], ["left", "Left"], ["right", "Right"]]);
buildToggle("ctlDoor", "showDoor", "Door + landing");
buildToggle("ctlDoor", "doorSwingOut", "Swings out");
buildAppearanceControls();
buildColorControls();

function initTabs() {
  const buttons = document.querySelectorAll(".tabbar button");
  buttons.forEach(btn => btn.addEventListener("click", () => {
    buttons.forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    document.querySelectorAll(".tabpanel").forEach(p => p.classList.remove("active"));
    document.getElementById(btn.dataset.tab).classList.add("active");
  }));
}
initTabs();

render();
</script>
