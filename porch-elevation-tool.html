<div class="wrap">

  <!-- Same idea as the garage file — everything comes from the CONFIG

<script src="shared.js"></script>
<script>
"use strict";

/* ===================================================================
   CONFIG — feet unless the name says inches or percent.
   =================================================================== */

const CONFIG = {
  bays:              4,     // bays drawn (the real porch has ~10)
  bayWidthFt:        43/12, // nominal clear width (43"); sets the total run. The door
                             // bay is pinned to doorWidthFt, the rest split what's left evenly
  postSizeIn:        5.5,   // 6x6 actual
  openingHeightFt:   6.25,  // deck to underside of header — 6.25 + the 0.75 header = 7' to the top of the header
  railHeightFt:      4,     // deck to top of the handrail cap
  railBotFt:         0,     // deck to the bottom of the rail assembly — 0 sits it flush with the floor
  deckAboveGradeFt:  2.5,   // deck surface above grade
  transomTallIn:     14,    // transom height at the house end (in)
  transomShortIn:    0,     // transom height at the far end — flush with the header (in)

  showDoor:          true,
  doorBay:           4,     // 1-based; the door fills this bay
  doorWidthFt:       3,     // the door bay is pinned to this width
  doorSwingOut:      true,

  landingBays:       1.5,   // 1, 1.5 or 2 bay widths
  stairPct:          70,    // stair width as a % of landing width
  stairAlign:        "center",  // "left" | "center" | "right"
  riserInches:       7,

  screensOn:         false,     // Screen Tight-style molding over the non-door bays
  screenMount:       "surface", // "surface" | "inset" (their "Mini Track")
  screenWidth:       "standard",// "standard" (1.5") | "wide" (3.5") — surface mount only
  screenColor:       "#FFFFFF", // White | Black | Dark Bronze
  screenSplit:       "transom", // "single" (whole bay) | "transom" (transom + main) | "all" (transom + above/below rail)

  pxPerFt:           34,

  // appearance — a starting palette, freely editable below
  colors: { post:"#8B5A2E", beam:"#8B5A2E", rail:"#8B5A2E", spindle:"#7E5029",
            floor:"#6F4522", riser:"#6F4522", skirt:"#8B5A2E", skirtbg:"#3A2A1B", interior:"#2F2C28",
            door:"#FFFFFF", stairRail:"#8B5A2E", stairSpindle:"#7E5029" }
};

/* Pre-configured color palettes. Any of these can be loaded, then tweaked
   freely via the swatches below. */

const PALETTES = [
  { name:"As it stands", c:{
      post:"#8B5A2E", beam:"#8B5A2E", rail:"#8B5A2E", spindle:"#7E5029",
      floor:"#6F4522", riser:"#6F4522", skirt:"#8B5A2E", skirtbg:"#3A2A1B", interior:"#2F2C28",
      door:"#FFFFFF", stairRail:"#8B5A2E", stairSpindle:"#7E5029" } },
  { name:"Trim white, dark floor", c:{
      post:"#EFEBE2", beam:"#EFEBE2", rail:"#EFEBE2", spindle:"#EFEBE2",
      floor:"#3B3430", riser:"#3B3430", skirt:"#EFEBE2", skirtbg:"#2A2522", interior:"#2E2C29",
      door:"#FFFFFF", stairRail:"#EFEBE2", stairSpindle:"#EFEBE2" } },
  { name:"Charcoal throughout", c:{
      post:"#343230", beam:"#343230", rail:"#343230", spindle:"#2C2A28",
      floor:"#2A2724", riser:"#2A2724", skirt:"#343230", skirtbg:"#1E1C1A", interior:"#242220",
      door:"#FFFFFF", stairRail:"#343230", stairSpindle:"#2C2A28" } },
  { name:"White frame, black rail", c:{
      post:"#EFEBE2", beam:"#EFEBE2", rail:"#EFEBE2", spindle:"#2C2A27",
      floor:"#3B3430", riser:"#3B3430", skirt:"#EFEBE2", skirtbg:"#2A2522", interior:"#2E2C29",
      door:"#FFFFFF", stairRail:"#EFEBE2", stairSpindle:"#2C2A27" } }
];

const SCREEN_COLORS = [
  ["#FFFFFF", "White"],
  ["#040707", "Black"],
  ["#423314", "Dark Bronze"]
];

const COLOR_ROLES = [
  ["post",     "Posts"],
  ["beam",     "Beam / header"],
  ["rail",     "Deck rail"],
  ["spindle",  "Deck spindles"],
  ["floor",    "Tread (horizontal)"],
  ["riser",    "Riser (vertical)"],
  ["skirt",    "Skirt trim"],
  ["skirtbg",  "Skirt background"],
  ["interior", "Interior (screen)"],
  ["door",     "Door"],
  ["stairRail",    "Stair rail"],
  ["stairSpindle", "Stair spindles"]
];

/* Bay widths in feet: normally uniform, but the door bay is pinned to
   cfg.doorWidthFt and the rest of the run splits evenly across the other
   bays. Shared by geometry() (px) and runChecks() (ft) so both agree. */
function bayWidthsFt(cfg) {
  const doorBayIdx = cfg.showDoor ? Math.min(cfg.doorBay, cfg.bays) - 1 : -1;
  const doorWFt = cfg.doorWidthFt;
  const totalClearFt = cfg.bays * cfg.bayWidthFt;
  const otherCount = doorBayIdx >= 0 ? cfg.bays - 1 : cfg.bays;
  const otherWFt = otherCount > 0
    ? (totalClearFt - (doorBayIdx >= 0 ? doorWFt : 0)) / otherCount
    : totalClearFt;
  const widths = [];
  for (let i = 0; i < cfg.bays; i++) widths.push(i === doorBayIdx ? doorWFt : otherWFt);
  return { widths, doorBayIdx, doorWFt };
}

/* ===================================================================
   Geometry
   =================================================================== */

function geometry(cfg) {
  const S = cfg.pxPerFt;
  const ft = f => f * S;
  const inch = i => (i / 12) * S;

  const PW = inch(cfg.postSizeIn);
  const houseW = ft(3.2);
  const x0 = houseW;                                  // face of the first post

  const { widths: bayWidthsFtArr, doorBayIdx } = bayWidthsFt(cfg);
  const bayWidths = bayWidthsFtArr.map(ft);
  const porchW = bayWidths.reduce((a, b) => a + b, 0) + (cfg.bays + 1) * PW;
  const x1 = x0 + porchW;

  const topPad = ft(0.5);
  const roofBand = ft(0.55);
  const headerH = ft(0.75);

  // vertical stack, worked down from the tallest point
  const roofTopL = topPad;
  const headerTopY = roofTopL + roofBand + inch(cfg.transomTallIn);
  const headerBotY = headerTopY + headerH;
  const deckTopY = headerBotY + ft(cfg.openingHeightFt);
  const deckFasciaH = ft(0.62);
  const groundY = deckTopY + ft(cfg.deckAboveGradeFt);
  const skirtTopY = deckTopY + deckFasciaH;

  // top rail: a 1.5" cap over a 1.5" sub-rail that the balusters hook into.
  // bottom rail: a 1.5" sub-rail the balusters hook into, over a 1.5" base
  // board — railBotFt measures to the bottom of that base board, so 0 sits
  // the whole assembly flush with the floor.
  const boardH = inch(1.5);
  const railTopCapY = deckTopY - ft(cfg.railHeightFt);
  const railTopCapH = boardH;
  const railTopSubY = railTopCapY + boardH;
  const railTopSubH = boardH;

  const railBotBaseBotY = deckTopY - ft(cfg.railBotFt);
  const railBotBaseY = railBotBaseBotY - boardH;
  const railBotBaseH = boardH;
  const railBotSubY = railBotBaseY - boardH;
  const railBotSubH = boardH;

  // rake: roof underside falls from the house end to the far end
  const rakeL = headerTopY - inch(cfg.transomTallIn);
  const rakeR = headerTopY - inch(cfg.transomShortIn);
  const rakeY = x => rakeL + (x - x0) * ((rakeR - rakeL) / (x1 - x0));

  // posts and bays, built cumulatively since bay widths may differ
  const posts = [x0], bays = [];
  for (let i = 0; i < cfg.bays; i++) {
    const a = posts[i] + PW;
    bays.push([a, a + bayWidths[i]]);
    posts.push(a + bayWidths[i]);
  }

  const W = x1 + ft(1.4);
  const H = groundY + ft(1.5);

  return { S, ft, inch, PW, bayWidths, doorBayIdx, x0, x1, posts, bays, rakeY,
           roofTopL, roofBand, headerTopY, headerBotY, headerH,
           deckTopY, deckFasciaH, skirtTopY, groundY,
           railTopCapY, railTopCapH, railTopSubY, railTopSubH,
           railBotSubY, railBotSubH, railBotBaseY, railBotBaseH, railBotBaseBotY,
           W, H };
}

/* landing and stair extents, in px. "1 bay" is just the door bay; "1.5"
   and "2" extend the landing into the real neighboring bay by that
   fraction, rather than a multiple of the door's own width — so the extra
   size reflects the actual (usually wider) bay next door. */
function stairLayout(cfg, g) {
  if (!cfg.showDoor) return null;
  const idx = g.doorBayIdx;
  const bay = g.bays[idx];

  // extend toward the bay before the door (the porch interior) when one
  // exists, otherwise the bay after — a single-bay porch has no neighbor
  const hasLeft = idx > 0, hasRight = idx < g.bays.length - 1;
  const neighborIdx = hasLeft ? idx - 1 : (hasRight ? idx + 1 : -1);
  const neighborW = neighborIdx >= 0 ? (g.bays[neighborIdx][1] - g.bays[neighborIdx][0]) : 0;
  const extraFrac = Math.max(0, Math.min(1, cfg.landingBays - 1));

  let la, lb;
  if (neighborIdx === idx - 1) {
    lb = bay[1];
    la = bay[0] - extraFrac * neighborW;
  } else if (neighborIdx === idx + 1) {
    la = bay[0];
    lb = bay[1] + extraFrac * neighborW;
  } else {
    la = bay[0]; lb = bay[1];
  }

  const landW = lb - la;
  const cx = (la + lb) / 2;

  const stairW = landW * (cfg.stairPct / 100);
  let sa;
  if (cfg.stairAlign === "left") sa = la;
  else if (cfg.stairAlign === "right") sa = lb - stairW;
  else sa = cx - stairW / 2;

  return { bay, cx, la, lb, landW, sa, sb: sa + stairW, stairW };
}

/* ===================================================================
   Drawing
   =================================================================== */

const rect = (x, y, w, h, f) =>
  `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}"/>`;
const poly = (pts, f) => `<polygon points="${pts}" fill="${f}"/>`;

/* balusters filling a run, spaced evenly so the gap at each end matches
   the gaps between balusters (rather than running a fixed gap from the
   left edge and leaving a leftover remainder on the right). */
function balusters(a, b, top, bottom, g, colorVar = "--spindle") {
  const bw = g.inch(1.6), targetGap = g.inch(3.9);
  const w = b - a;
  const n = Math.max(1, Math.round((w - targetGap) / (bw + targetGap)));
  const gap = (w - n * bw) / (n + 1);
  let s = "";
  for (let i = 0; i < n; i++) {
    const x = a + gap + i * (bw + gap);
    s += rect(x, top, bw, bottom - top, `var(${colorVar})`);
  }
  return s;
}

/* Screen Tight-style molding border, drawn either proud of an opening
   ("surface", outside the given rect) or trimmed just inside it ("inset"). */
function frameOutside(x, y, w, h, t, color, edges) {
  const top = !edges || edges.top !== false, bottom = !edges || edges.bottom !== false;
  const left = !edges || edges.left !== false, right = !edges || edges.right !== false;
  return (top ? rect(x - t, y - t, w + 2 * t, t, color) : "") +
         (bottom ? rect(x - t, y + h, w + 2 * t, t, color) : "") +
         (left ? rect(x - t, y, t, h, color) : "") +
         (right ? rect(x + w, y, t, h, color) : "");
}
function frameInside(x, y, w, h, t, color, edges) {
  const top = !edges || edges.top !== false, bottom = !edges || edges.bottom !== false;
  return (top ? rect(x, y, w, t, color) : "") +
         (bottom ? rect(x, y + h - t, w, t, color) : "") +
         rect(x, y, t, h, color) +
         rect(x + w - t, y, t, h, color);
}

/* Same idea, but the top edge follows a sloped line (topFn(x)) instead of
   a flat y — used where the frame has to follow the roof rake, and needs
   its verticals to meet that line at the right height on each side. */
function slopedFrameOutside(a, c, topFn, bottomY, t, color, edges) {
  const left = !edges || edges.left !== false, right = !edges || edges.right !== false;
  const topL = topFn(a), topR = topFn(c);
  return poly(`${a - t},${topL - t} ${c + t},${topR - t} ${c + t},${topR} ${a - t},${topL}`, color) +
         rect(a - t, bottomY, (c - a) + 2 * t, t, color) +
         (left ? rect(a - t, topL, t, (bottomY - topL) + t, color) : "") +
         (right ? rect(c, topR, t, (bottomY - topR) + t, color) : "");
}
function slopedFrameInside(a, c, topFn, bottomY, t, color) {
  const topL = topFn(a), topR = topFn(c);
  return poly(`${a},${topL} ${c},${topR} ${c},${topR + t} ${a},${topL + t}`, color) +
         rect(a, bottomY - t, c - a, t, color) +
         rect(a, topL, t, bottomY - topL, color) +
         rect(c - t, topR, t, bottomY - topR, color);
}

/* One continuous vertical strip at a shared post between two screened
   bays — surface mount only, since surface trim runs proud of the post
   and a wide board should span it as one piece rather than each bay
   mounting its own overlapping half. Segmented the same way the bays'
   own edges are, so it still breaks at the header and handrail. */
function sharedPostVertical(cfg, g, xCenter, t, color) {
  const split = cfg.screenSplit;
  const x0 = xCenter - t / 2;
  const rakeTop = g.rakeY(xCenter);
  if (split === "single") return rect(x0, rakeTop, t, g.deckTopY - rakeTop, color);

  let s = rect(x0, rakeTop, t, g.headerTopY - rakeTop, color);
  if (split === "transom") {
    s += rect(x0, g.headerBotY, t, g.deckTopY - g.headerBotY, color);
  } else {
    const railBot = g.railTopSubY + g.railTopSubH;
    s += rect(x0, g.headerBotY, t, g.railTopCapY - g.headerBotY, color);
    s += rect(x0, g.railTopCapY, t, railBot - g.railTopCapY, color);
    s += rect(x0, railBot, t, g.deckTopY - railBot, color);
  }
  return s;
}

/* screen molding over the non-door bays. screenSplit controls how many
   pieces make up each bay:
   - "single": one frame per bay, roofline to floor, running straight
     through the header and handrail.
   - "transom": a transom piece (following the rake) plus one frame for
     the whole main opening, unbroken by the handrail.
   - "all": transom, then separate frames above and below the handrail —
     the handrail's own thickness is left unmolded either way, since real
     track is a single top-and-bottom-receiving piece, not a wrap. */
function drawScreens(cfg, g, doorIdx) {
  if (!cfg.screensOn) return "";
  let s = "";
  const color = cfg.screenColor;
  const surface = cfg.screenMount === "surface";
  const flatFrame = surface ? frameOutside : frameInside;
  const slopeFrame = surface ? slopedFrameOutside : slopedFrameInside;
  const t = surface ? g.inch(cfg.screenWidth === "wide" ? 3.5 : 1.5) : g.inch(0.75);
  const split = cfg.screenSplit;
  const isScreenable = i => i >= 0 && i < g.bays.length && i !== doorIdx;

  g.bays.forEach((b, i) => {
    if (!isScreenable(i)) return;
    const a = b[0], c = b[1], w = c - a;
    // a shared post between two screened bays gets one vertical piece
    // (below), not one from each side, so surface skips its own here
    const edges = surface
      ? { left: !isScreenable(i - 1), right: !isScreenable(i + 1) }
      : undefined;

    if (split === "single") {
      s += slopeFrame(a, c, g.rakeY, g.deckTopY, t, color, edges);
      return;
    }

    s += slopeFrame(a, c, g.rakeY, g.headerTopY, t, color, edges);

    if (split === "transom") {
      s += flatFrame(a, g.headerBotY, w, g.deckTopY - g.headerBotY, t, color, edges);
    } else {
      // the below-rail piece has to clear the whole handrail (both the
      // cap and the sub-rail the balusters mortise into), not stop partway
      // through it — otherwise it visually overlaps the rail instead of
      // sitting below it. The two frames share a single spline piece that
      // spans that full thickness instead of each having its own cap
      const railBot = g.railTopSubY + g.railTopSubH;
      s += flatFrame(a, g.headerBotY, w, g.railTopCapY - g.headerBotY, t, color, { ...edges, bottom: false });
      s += flatFrame(a, railBot, w, g.deckTopY - railBot, t, color, { ...edges, top: false });
      const railH = railBot - g.railTopCapY;
      if (surface) {
        // a solid batten across the whole opening, same as real surface trim
        s += rect(a - t, g.railTopCapY, w + 2 * t, railH, color);
      } else {
        // inset stays a thin outline — just the two side pieces continuing
        // through, not a solid fill hiding the rail behind them
        if (!edges || edges.left !== false) s += rect(a, g.railTopCapY, t, railH, color);
        if (!edges || edges.right !== false) s += rect(c - t, g.railTopCapY, t, railH, color);
      }
    }
  });

  if (surface) {
    g.bays.forEach((b, i) => {
      if (!isScreenable(i) || !isScreenable(i + 1)) return;
      const xCenter = (b[1] + g.bays[i + 1][0]) / 2;
      s += sharedPostVertical(cfg, g, xCenter, t, color);
    });
  }

  return s;
}

/* screen door filling its whole bay */
function screenDoor(bay, g, cfg) {
  const a = bay[0], w = bay[1] - bay[0];
  const top = g.headerBotY, h = g.deckTopY - top;
  const st = g.inch(4.5);                 // stile / rail width
  const kick = g.ft(1.5);                 // solid panel at the bottom
  let s = rect(a, top, w, h, "var(--interior)");
  s += rect(a, top, w, h, "rgba(140,150,145,0.10)");

  s += rect(a, top, st, h, "var(--door)");
  s += rect(a + w - st, top, st, h, "var(--door)");
  s += rect(a, top, w, st, "var(--door)");
  s += rect(a, g.deckTopY - st, w, st, "var(--door)");
  s += rect(a, g.deckTopY - kick - st, w, st, "var(--door)");
  s += rect(a + st, g.deckTopY - kick, w - st * 2, kick - st, "var(--door)");
  s += rect(a + st, g.deckTopY - kick, w - st * 2, 2, "rgba(0,0,0,0.20)");

  // hinge side and handle follow the swing
  const hx = cfg.doorSwingOut ? a + w - st * 2.2 : a + st * 1.4;
  s += rect(hx, g.deckTopY - kick - g.ft(1.1), g.inch(1.6), g.inch(7), "rgba(0,0,0,0.45)");
  return s;
}

/* landing and steps, seen end-on */
function landingSteps(L, g, cfg) {
  const LT = g.deckTopY + g.inch(2);          // landing sits a touch below the threshold
  const LF = g.ft(0.66);                       // landing fascia
  const n = Math.max(1, Math.round((cfg.deckAboveGradeFt * 12) / cfg.riserInches));
  const stepH = (g.groundY - (LT + LF)) / n;
  // each tread a little wider as it nears you, but never past the landing edges
  const grow = Math.min(g.inch(4), Math.max(0, L.landW - L.stairW));
  const RH = g.ft(2.9);                        // guard height
  let s = "";

  // shadow on the skirt behind
  s += rect(L.la - 6, LT, L.landW + 12, g.groundY - LT, "rgba(0,0,0,0.30)");

  // landing — riser-colored fascia with a tread-colored cap along the top
  s += rect(L.la, LT, L.landW, LF, "var(--riser)");
  s += rect(L.la, LT, L.landW, LF, "rgba(255,255,255,0.12)");
  s += rect(L.la, LT, L.landW, Math.min(g.inch(2), LF), "var(--floor)");
  s += rect(L.la, LT, L.landW, 2, "rgba(255,255,255,0.32)");
  s += rect(L.la, LT + LF - 3, L.landW, 3, "rgba(0,0,0,0.34)");

  // steps
  for (let i = 0; i < n; i++) {
    const w = L.stairW + grow * (i / Math.max(1, n - 1));
    const cxS = (L.sa + L.sb) / 2;
    const y = LT + LF + i * stepH;
    s += rect(cxS - w / 2, y, w, stepH, "var(--riser)");
    s += rect(cxS - w / 2, y, w, stepH, "rgba(255,255,255,0.12)");
    s += rect(cxS - w / 2, y, w, Math.min(g.inch(2), stepH), "var(--floor)");
    s += rect(cxS - w / 2, y, w, 2, "rgba(255,255,255,0.32)");
    s += rect(cxS - w / 2, y + stepH - 3, w, 3, "rgba(0,0,0,0.34)");
  }

  // guard across the parts of the landing the stairs don't use
  [[L.la, L.sa], [L.sb, L.lb]].forEach(seg => {
    const w = seg[1] - seg[0];
    if (w < g.inch(4)) return;
    s += rect(seg[0], LT - RH, w, g.inch(2.6), "var(--stairRail)");
    s += rect(seg[0], LT - g.ft(0.5), w, g.inch(2.2), "var(--stairRail)");
    s += balusters(seg[0], seg[1], LT - RH + g.inch(2.6), LT - g.ft(0.5), g, "--stairSpindle");
  });

  // newels at the landing corners and either side of the steps
  [L.la, L.lb, L.sa, L.sb].forEach(x => {
    const nw = g.inch(4.5);
    s += rect(x - nw / 2, LT - RH - g.inch(2), nw, RH + g.inch(2), "var(--stairRail)");
    s += rect(x - nw / 2 - 3, LT - RH - g.inch(5), nw + 6, g.inch(3.4), "var(--stairRail)");
  });

  // stair guards running down beside the steps
  [-1, 1].forEach(k => {
    const xTop = k < 0 ? L.sa : L.sb;
    const cxS = (L.sa + L.sb) / 2;
    const xBot = cxS + k * ((L.stairW + grow) / 2);
    const bw = g.inch(3.6);
    s += rect(xBot - bw / 2, g.groundY - RH, bw, RH, "var(--stairRail)");
    s += poly(
      `${xTop + k * bw / 2},${LT - RH} ${xBot + k * bw / 2},${g.groundY - RH} ` +
      `${xBot - k * bw / 2},${g.groundY - RH + g.inch(2.8)} ${xTop - k * bw / 2},${LT - RH + g.inch(2.8)}`,
      "var(--stairRail)");
    for (let t = 0.3; t < 0.95; t += 0.32) {
      const bx = xTop + (xBot - xTop) * t;
      const byT = (LT - RH) + ((g.groundY - RH) - (LT - RH)) * t;
      const byB = (LT + LF) + (g.groundY - (LT + LF)) * t;
      s += rect(bx - g.inch(0.9), byT + g.inch(2.8), g.inch(1.8), byB - byT - g.inch(2.8), "var(--stairSpindle)");
    }
  });

  return s;
}

function drawPorch(cfg, uid) {
  const g = geometry(cfg);
  const L = stairLayout(cfg, g);
  const doorIdx = cfg.showDoor ? Math.min(cfg.doorBay, cfg.bays) - 1 : -1;

  // a landing that runs past the porch corner still has to fit in the frame
  if (L) g.W = Math.max(g.W, L.lb + g.ft(1.2));

  let s = "";

  // diamond lattice: a plain crosshatch grid, rotated 45deg by the pattern
  // itself so the strips read as diamonds rather than a square grid
  const latP = g.inch(3.6), latSW = g.inch(0.85);

  s += `<defs>
    <pattern id="bk${uid}" width="46" height="15" patternUnits="userSpaceOnUse">
      <rect width="46" height="15" fill="#A5503C"/>
      <rect width="46" height="2" y="13" fill="#8B4231"/>
      <rect width="2" height="15" fill="#8B4231"/>
      <rect width="2" height="15" x="23" fill="#9A4A37"/>
    </pattern>
    <pattern id="lat${uid}" width="${latP}" height="${latP}" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="${latP}" stroke="var(--skirt)" stroke-width="${latSW}"/>
      <line x1="0" y1="0" x2="${latP}" y2="0" stroke="var(--skirt)" stroke-width="${latSW}"/>
    </pattern>
    <clipPath id="op${uid}"><polygon points="${g.x0},${g.rakeY(g.x0)} ${g.x1},${g.rakeY(g.x1)} ${g.x1},${g.deckTopY} ${g.x0},${g.deckTopY}"/></clipPath>
  </defs>`;

  // sky, ground, house wall
  s += rect(0, 0, g.W, g.groundY, "var(--sky)");
  s += rect(0, g.groundY, g.W, g.H - g.groundY, "var(--grass)");
  s += rect(0, 0, g.x0, g.groundY, `url(#bk${uid})`);
  s += rect(g.x0 - 6, 0, 6, g.groundY, "rgba(0,0,0,0.16)");

  // porch interior seen through the screen
  s += `<g clip-path="url(#op${uid})">`;
  s += rect(g.x0, 0, g.x1 - g.x0, g.deckTopY, "var(--interior)");
  s += rect(g.x0, 0, g.x1 - g.x0, g.deckTopY, "rgba(140,150,145,0.13)");
  s += "</g>";

  // shed roof: shingle sliver over a white fascia, following the rake
  const rl = g.rakeY(g.x0 - g.ft(0.4)), rr = g.rakeY(g.x1 + g.ft(0.4));
  const RB = g.roofBand;
  s += poly(`${g.x0 - g.ft(0.4)},${rl - RB - g.ft(0.32)} ${g.x1 + g.ft(0.4)},${rr - RB - g.ft(0.32)} ${g.x1 + g.ft(0.4)},${rr - RB} ${g.x0 - g.ft(0.4)},${rl - RB}`, "#31302E");
  s += poly(`${g.x0 - g.ft(0.4)},${rl - RB} ${g.x1 + g.ft(0.4)},${rr - RB} ${g.x1 + g.ft(0.4)},${rr} ${g.x0 - g.ft(0.4)},${rl}`, "#F1EDE5");
  s += poly(`${g.x0 - g.ft(0.4)},${rl - 4} ${g.x1 + g.ft(0.4)},${rr - 4} ${g.x1 + g.ft(0.4)},${rr} ${g.x0 - g.ft(0.4)},${rl}`, "rgba(0,0,0,0.14)");

  // header beam
  s += rect(g.x0, g.headerTopY, g.x1 - g.x0, g.headerH, "var(--beam)");
  s += rect(g.x0, g.headerBotY - 3, g.x1 - g.x0, 3, "rgba(0,0,0,0.17)");

  // rails, interrupted at the door bay
  const runs = doorIdx < 0
    ? [[g.x0, g.x1]]
    : [[g.x0, g.bays[doorIdx][0] - g.PW], [g.bays[doorIdx][1] + g.PW, g.x1]];
  runs.forEach(run => {
    const w = run[1] - run[0];
    if (w <= 0) return;
    s += rect(run[0], g.railTopCapY, w, g.railTopCapH, "var(--rail)");
    s += rect(run[0], g.railTopCapY + g.railTopCapH - 3, w, 3, "rgba(0,0,0,0.15)");
    s += rect(run[0], g.railTopSubY, w, g.railTopSubH, "var(--rail)");
    s += rect(run[0], g.railTopSubY + g.railTopSubH - 3, w, 3, "rgba(0,0,0,0.15)");
    s += rect(run[0], g.railBotSubY, w, g.railBotSubH, "var(--rail)");
    s += rect(run[0], g.railBotSubY + g.railBotSubH - 3, w, 3, "rgba(0,0,0,0.15)");
    s += rect(run[0], g.railBotBaseY, w, g.railBotBaseH, "var(--rail)");
  });

  // spindles — hooked between the top and bottom sub-rails
  g.bays.forEach((b, i) => {
    if (i === doorIdx) return;
    s += balusters(b[0], b[1], g.railTopSubY + g.railTopSubH, g.railBotSubY, g);
  });

  if (doorIdx >= 0) s += screenDoor(g.bays[doorIdx], g, cfg);

  // posts
  g.posts.forEach(x => {
    const top = g.rakeY(x + g.PW / 2);
    s += rect(x, top, g.PW, g.deckTopY - top, "var(--post)");
    s += rect(x + g.PW - 4, top, 4, g.deckTopY - top, "rgba(0,0,0,0.14)");
  });

  // deck band
  s += rect(g.x0, g.deckTopY, g.x1 - g.x0, g.deckFasciaH, "var(--floor)");
  s += rect(g.x0, g.deckTopY, g.x1 - g.x0, 3, "rgba(255,255,255,0.16)");

  // skirt: one diamond lattice panel running uninterrupted the whole way
  // to the end of the deck, flush to the frame with no margin — the
  // landing/steps (drawn afterward) cover whatever's behind them
  s += rect(g.x0, g.skirtTopY, g.x1 - g.x0, g.groundY - g.skirtTopY, "var(--skirtbg)");
  {
    const a = g.x0, c = g.x1, t = g.skirtTopY, u = g.groundY;
    s += rect(a, t, c - a, u - t, `url(#lat${uid})`);
    s += rect(a, t, c - a, g.inch(2), "var(--skirt)");
    s += rect(a, u - g.inch(2), c - a, g.inch(2), "var(--skirt)");
    s += rect(a, t, g.inch(2), u - t, "var(--skirt)");
    s += rect(c - g.inch(2), t, g.inch(2), u - t, "var(--skirt)");
  }
  s += rect(g.x0, g.groundY - 4, g.x1 - g.x0, 4, "rgba(0,0,0,0.25)");

  // molding is surface-applied trim, so it's drawn last — otherwise the
  // deck band paints right over the bottom of the frame
  s += drawScreens(cfg, g, doorIdx);

  if (L) s += landingSteps(L, g, cfg);

  const site = { sky:"#CBD8DF", grass:"#8C9A72" };
  const vars = Object.entries({ ...cfg.colors, ...site }).map(([k, v]) => `--${k}:${v}`).join(";");
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${Math.round(g.W)} ${Math.round(g.H)}" style="${vars}">${s}</svg>`;
}

/* ===================================================================
   Checks
   =================================================================== */

function runChecks(cfg) {
  const out = [];
  const { widths, doorBayIdx } = bayWidthsFt(cfg);

  if (cfg.showDoor) {
    const doorFt = widths[doorBayIdx];

    // the landing extends into the real neighboring bay, not a multiple of
    // the door's own width — same rule as stairLayout()
    const hasLeft = doorBayIdx > 0, hasRight = doorBayIdx < cfg.bays - 1;
    const neighborIdx = hasLeft ? doorBayIdx - 1 : (hasRight ? doorBayIdx + 1 : -1);
    const neighborFt = neighborIdx >= 0 ? widths[neighborIdx] : 0;
    const extraFrac = Math.max(0, Math.min(1, cfg.landingBays - 1));
    const landFt = doorFt + extraFrac * neighborFt;
    const stairFt = landFt * (cfg.stairPct / 100);

    if (neighborIdx < 0 && extraFrac > 0) {
      out.push({ ok: false, label: "Landing extension",
        value: "no neighbor bay — capped to door width" });
    }

    const sideFt = (landFt - doorFt) / 2;
    out.push({ ok: landFt >= doorFt,
      label: "Landing beyond door",
      value: sideFt > 0 ? `${(sideFt * 12).toFixed(0)}" into next bay` : "flush with door" });

    out.push({ ok: stairFt >= 3, label: "Stair width", value: `${stairFt.toFixed(1)}'` });

    const inset = landFt - stairFt;
    out.push({ ok: inset >= 1,
      label: "Landing beyond stairs",
      value: `${(inset * 12).toFixed(0)}" total` });

    const risers = Math.max(1, Math.round((cfg.deckAboveGradeFt * 12) / cfg.riserInches));
    const rh = (cfg.deckAboveGradeFt * 12) / risers;
    out.push({ ok: rh >= 4 && rh <= 7.75,
      label: `Riser height (${risers} risers)`, value: `${rh.toFixed(2)}"` });
  }

  out.push({ ok: true, label: "Porch width drawn",
    value: `${(cfg.bays * cfg.bayWidthFt + (cfg.bays + 1) * cfg.postSizeIn / 12).toFixed(1)}'` });

  return out;
}

/* ===================================================================
   UI
   =================================================================== */

const FIELDS_PORCH_LAYOUT = [
  ["bays", "Bays drawn", 1, 12, 1],
  ["bayWidthFt", "Bay width, avg (in)", 24, 144, 1],
  ["postSizeIn", "Post size (in)", 3, 12, 0.5]
];
const FIELDS_PORCH_OPENINGS = [
  ["openingHeightFt", "Opening height (in)", 48, 144, 1],
  ["transomTallIn", "Transom, house end (in)", 0, 72, 0.5],
  ["transomShortIn", "Transom, far end (in)", 0, 72, 0.5]
];
const FIELDS_PORCH_RAIL_DECK = [
  ["railHeightFt", "Rail height (in)", 30, 54, 1],
  ["railBotFt", "Rail bottom (in, 0 = floor)", 0, 24, 1],
  ["deckAboveGradeFt", "Deck above grade (in)", 6, 96, 1]
];
const FIELDS_PORCH_SCALE = [
  ["pxPerFt", "Scale (px/ft)", 10, 60, 1]
];

const FIELDS_DOOR = [
  ["doorBay", "Door in bay #", 1, 12, 1],
  ["doorWidthFt", "Door width (in)", 24, 72, 1]
];
const FIELDS_LANDING = [
  ["stairPct", "Stairs (% of landing)", 20, 100, 5],
  ["riserInches", "Riser (in)", 4, 8, 0.25]
];

/* Fields stored in CONFIG as feet but shown/edited in inches (the tool's
   measurements are all specified in inches on site); everything else in
   these lists is already inches, a count, or a percent. */
const FEET_STORED_FIELDS = new Set([
  "bayWidthFt", "openingHeightFt", "railHeightFt", "railBotFt",
  "deckAboveGradeFt", "doorWidthFt"
]);
const NO_UNIT_FIELDS = new Set(["bays", "doorBay", "stairPct", "pxPerFt"]);

function buildNumbers(hostId, fields) {
  const host = document.getElementById(hostId);
  fields.forEach(([key, label, min, max, step]) => {
    const l = document.createElement("label");
    l.innerHTML = `<span>${label}</span>`;
    const inp = document.createElement("input");
    inp.type = "number"; inp.min = min; inp.max = max; inp.step = step;

    if (NO_UNIT_FIELDS.has(key)) {
      inp.value = CONFIG[key];
      inp.addEventListener("input", () => {
        const v = parseFloat(inp.value);
        if (!Number.isNaN(v)) { CONFIG[key] = v; render(); }
      });
    } else {
      const storedInFeet = FEET_STORED_FIELDS.has(key);
      const toIn = () => storedInFeet ? CONFIG[key] * 12 : CONFIG[key];
      const updateTitle = () => {
        const ft = storedInFeet ? CONFIG[key] : CONFIG[key] / 12;
        inp.title = `${ft.toFixed(2)}'`;
      };
      inp.value = Math.round(toIn() * 100) / 100;
      updateTitle();
      inp.addEventListener("input", () => {
        const v = parseFloat(inp.value);
        if (!Number.isNaN(v)) {
          CONFIG[key] = storedInFeet ? v / 12 : v;
          updateTitle();
          render();
        }
      });
    }
    l.appendChild(inp); host.appendChild(l);
  });
}

function buildSelect(hostId, key, label, options) {
  const host = document.getElementById(hostId);
  const l = document.createElement("label");
  l.dataset.key = key;
  l.innerHTML = `<span>${label}</span>`;
  const sel = document.createElement("select");
  options.forEach(([v, t]) => {
    const o = document.createElement("option");
    o.value = v; o.textContent = t;
    if (String(CONFIG[key]) === String(v)) o.selected = true;
    sel.appendChild(o);
  });
  sel.addEventListener("change", () => {
    const n = parseFloat(sel.value);
    CONFIG[key] = Number.isNaN(n) ? sel.value : n;
    render();
  });
  l.appendChild(sel); host.appendChild(l);
}

function buildSwatches(hostId, key, options) {
  const host = document.getElementById(hostId);
  const buttons = [];
  options.forEach(([hex, name]) => {
    const wrap = document.createElement("div");
    wrap.className = "screen-swatch-wrap";

    const b = document.createElement("button");
    b.type = "button";
    b.className = "screen-swatch";
    b.style.background = hex;
    b.title = name;
    b.setAttribute("aria-label", name);
    if (CONFIG[key] === hex) b.classList.add("selected");
    b.addEventListener("click", () => {
      CONFIG[key] = hex;
      buttons.forEach(x => x.classList.toggle("selected", x === b));
      render();
    });
    buttons.push(b);

    const nameEl = document.createElement("span");
    nameEl.className = "screen-swatch-name";
    nameEl.textContent = name;

    wrap.appendChild(b);
    wrap.appendChild(nameEl);
    host.appendChild(wrap);
  });
}

function buildToggle(hostId, key, label) {
  const host = document.getElementById(hostId);
  const l = document.createElement("label");
  l.innerHTML = `<span>&nbsp;</span>`;
  const row = document.createElement("span");
  row.className = "check-row";
  const inp = document.createElement("input");
  inp.type = "checkbox"; inp.checked = CONFIG[key];
  inp.addEventListener("change", () => { CONFIG[key] = inp.checked; render(); });
  row.appendChild(inp); row.appendChild(document.createTextNode(label));
  l.appendChild(row);
  host.appendChild(l);
}


/* Share links — see shared.js for the codec itself. This schema is
   page-specific: it lists CONFIG's fields, their short wire codes, and
   how to (de)serialize each one. Once a code has shipped, never reassign
   it to a different field — mint a new code instead; it's safe to add,
   remove, or reorder entries here freely. */
const SHARE_SCHEMA = {
  bays:             { code: "ba",  type: "num" },
  bayWidthFt:       { code: "bw",  type: "num" },
  postSizeIn:       { code: "ps",  type: "num" },
  openingHeightFt:  { code: "oh",  type: "num" },
  railHeightFt:     { code: "rh",  type: "num" },
  railBotFt:        { code: "rb",  type: "num" },
  deckAboveGradeFt: { code: "dg",  type: "num" },
  transomTallIn:    { code: "tt",  type: "num" },
  transomShortIn:   { code: "ts",  type: "num" },
  showDoor:         { code: "sd",  type: "bool" },
  doorBay:          { code: "db",  type: "num" },
  doorWidthFt:      { code: "dw",  type: "num" },
  doorSwingOut:     { code: "so",  type: "bool" },
  landingBays:      { code: "lb",  type: "num" },
  stairPct:         { code: "sp",  type: "num" },
  stairAlign:       { code: "sa",  type: "str" },
  riserInches:      { code: "ri",  type: "num" },
  screensOn:        { code: "scO", type: "bool" },
  screenMount:      { code: "scM", type: "str" },
  screenWidth:      { code: "scW", type: "str" },
  screenColor:      { code: "scC", type: "str" },
  screenSplit:      { code: "scS", type: "str" },
  pxPerFt:          { code: "px",  type: "num" },
  colors:           { code: "col", type: "colors" }
};
const COLOR_KEYS = COLOR_ROLES.map(([k]) => k);
const share = createShareLink(CONFIG, SHARE_SCHEMA, COLOR_KEYS);

function render() {
  updateScreenFieldVisibility();
  document.getElementById("checks").innerHTML = runChecks(CONFIG).map(c =>
    `<div class="chk ${c.ok ? "ok" : "warn"}"><span class="dot"></span>` +
    `<span><span class="lbl">${c.label}</span> <b>${c.value}</b></span></div>`).join("");

  const out = document.getElementById("out");
  out.innerHTML = "";
  const svg = drawPorch(CONFIG, "p0");

  const wrap = document.createElement("div");
  wrap.className = "scheme";

  const shead = document.createElement("div");
  shead.className = "shead";
  shead.innerHTML = `<h3>Elevation</h3>`;
  shead.appendChild(buildElevationActions({
    getSvg: () => svg,
    filenames: { svg: "porch-elevation.svg", png: "porch-elevation.png" },
    updateURL: share.updateURL
  }));

  const art = document.createElement("div");
  art.className = "art";
  art.innerHTML = svg;
  attachImageContextMenu(art, { getSvg: () => svg, filename: "porch-elevation.png", updateURL: share.updateURL });

  wrap.appendChild(shead);
  wrap.appendChild(art);
  out.appendChild(wrap);

  share.afterRender();
}

share.loadFromURL();

insertFieldGroup("ctlPorch", "Layout");
buildNumbers("ctlPorch", FIELDS_PORCH_LAYOUT);
insertFieldGroup("ctlPorch", "Openings");
buildNumbers("ctlPorch", FIELDS_PORCH_OPENINGS);
insertFieldGroup("ctlPorch", "Rail & deck");
buildNumbers("ctlPorch", FIELDS_PORCH_RAIL_DECK);
insertFieldGroup("ctlPorch", "Scale");
buildNumbers("ctlPorch", FIELDS_PORCH_SCALE);

insertFieldGroup("ctlDoor", "Door");
buildNumbers("ctlDoor", FIELDS_DOOR);
buildToggle("ctlDoor", "showDoor", "Door + landing");
buildToggle("ctlDoor", "doorSwingOut", "Swings out");
insertFieldGroup("ctlDoor", "Landing & stairs");
buildSelect("ctlDoor", "landingBays", "Landing size",
  [[1, "1 bay"], [1.5, "1.5 bays"], [2, "2 bays"]]);
buildNumbers("ctlDoor", FIELDS_LANDING);
buildSelect("ctlDoor", "stairAlign", "Stair alignment",
  [["center", "Center"], ["left", "Left"], ["right", "Right"]]);

insertFieldGroup("ctlScreens", "Screens");
buildToggle("ctlScreens", "screensOn", "New Screens");
buildSelect("ctlScreens", "screenMount", "Mount type",
  [["surface", "Surface mounted"], ["inset", "Inset (Mini Track)"]]);
buildSelect("ctlScreens", "screenWidth", "Molding width",
  [["standard", "Standard (1.5\")"], ["wide", "Wide (3.5\")"]]);
buildSelect("ctlScreens", "screenSplit", "Bay coverage",
  [["single", "Whole bay, 1 piece"], ["transom", "Transom + main opening"], ["all", "Transom + above/below rail"]]);
insertFieldGroup("ctlScreens", "Molding color");
buildSwatches("ctlScreenColors", "screenColor", SCREEN_COLORS);

function updateScreenFieldVisibility() {
  const widthSel = document.querySelector('#ctlScreens label[data-key="screenWidth"] select');
  if (widthSel) widthSel.disabled = CONFIG.screenMount !== "surface";
}

buildAppearanceSection({
  paletteHostId: "ctlAppearance",
  swatchHostId: "ctlColors",
  palettes: PALETTES,
  colorRoles: COLOR_ROLES,
  config: CONFIG,
  onChange: render,
  namespace: "porch",
  exportName: "porch-palette.png"
});
initTabs();

render();
</script>
