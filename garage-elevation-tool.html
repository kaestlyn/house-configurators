<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garage Elevation Tool</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<nav class="tools">
  <a href="garage-elevation-tool.html" class="active">Garage</a>
  <a href="porch-elevation-tool.html">Porch</a>
</nav>
<div class="wrap">

  <!-- Everything is driven by the CONFIG object at the top of the script.
       The drawing is generated SVG; "Save SVG" hands you a file you can
       open in Figma or Inkscape. -->

  <div id="out"></div>

  <div class="tabbar">
    <button type="button" class="active" data-tab="tabBuilding">Building</button>
    <button type="button" data-tab="tabDoors">Doors &amp; dormers</button>
    <button type="button" data-tab="tabStairs">Stairs</button>
    <button type="button" data-tab="tabAppearance">Appearance</button>
    <button type="button" data-tab="tabChecks">Checks</button>
  </div>

  <div class="panel tabpanel active" id="tabBuilding">
    <div class="grid" id="ctlBuilding"></div>
  </div>

  <div class="panel tabpanel" id="tabDoors">
    <div class="grid" id="ctlDoors"></div>
  </div>

  <div class="panel tabpanel" id="tabStairs">
    <div class="grid" id="ctlStairs"></div>
  </div>

  <div class="panel tabpanel" id="tabAppearance">
    <div class="grid" id="ctlAppearance"></div>
    <div class="swatches" id="ctlColors"></div>
  </div>

  <div class="panel tabpanel" id="tabChecks">
    <div class="checks" id="checks"></div>
  </div>
</div>

<script src="shared.js"></script>
<script>
"use strict";

/* ===================================================================
   CONFIG — everything the drawing is built from. All dimensions in feet
   unless the name says inches. Change these and the drawing follows.
   =================================================================== */

const CONFIG = {
  widthFt:        33,     // the door wall
  depthFt:        24,     // front to back; sets ridge height with pitch
  wallHeightFt:   11,     // slab to plate (also the loft floor level)
  pitch:          10,     // rise per 12 of run

  doorWidths:   [9, 18],  // left to right
  doorHeightFt:   8,
  doorTrimIn:     4.5,    // casing width around each door
  cornerReturnFt: 2,      // wall at each end of the elevation
  pierFt:         2,      // wall between doors

  curbInches:     8,      // one course of block
  overhangInches: 16,     // eave and rake overhang

  showDormers:    true,
  dormerStyle:    "gable", // "gable" | "shed"
  dormerCount:    2,      // 0, 1, or 2 — 2 only takes effect with exactly 2 doors
  dormerPosition: "center", // "left" | "center" | "right" — used when dormerCount is 1
  dormerOffsetFt: 0,      // left/right only: distance in from the margin-clamped edge position
  dormerEdgeMarginFt: 2,  // left/right only: minimum clearance from the roof edge
  dormerWidths: [5, 10],  // one per door when dormerCount is 2; dormerWidths[0] when it's 1
  dormerWallFt:   3.5,    // face wall height below the dormer gable

  showStairs:     true,
  stairStyle:     "straight", // "straight" | "switchback"
  stairWidthFt:   4,
  riserInches:    7,
  treadInches:    11,
  lowerFlightSteps: 8,   // switchback only: steps in the lower (ground) flight; the rest go in the upper flight
  switchbackFlip: false, // switchback only: true puts the lower flight on the outside, upper flight nearer the wall

  showHouse:      true,
  houseGapFt:     13,     // garage wall to house wall

  pxPerFt:        16,     // drawing scale

  // appearance — siding type and colors are independent of each other
  siding:         "bb",   // "bb" (board & batten) or "lap"
  colors: { body:"#F0ECE3", batten:"#F5F1E9", trim:"#F0ECE3", door:"#2B2926", glass:"#8FA3AD", roof:"#2B2926", curb:"#5E5852", tread:"#2B2926", riser:"#2B2926" }
};

/* Siding types the wall pattern can be drawn in. */

const SIDING_TYPES = [
  { id: "bb",    name: "Board & batten" },
  { id: "lap",   name: "8\" lap" },
  { id: "vinyl", name: "Vinyl siding (double 4\")" },
  { id: "panel", name: "Vertical panel (T1-11)" },
  { id: "shake", name: "Cedar shake" }
];

/* Pre-configured color palettes. Any of these can be loaded, then tweaked
   freely — the palette and the siding type are chosen independently. */

const PALETTES = [
  { name: "White",       c: { body:"#F0ECE3", batten:"#F5F1E9", trim:"#F0ECE3", door:"#2B2926", glass:"#8FA3AD", roof:"#2B2926", curb:"#5E5852", tread:"#2B2926", riser:"#2B2926" } },
  { name: "Charcoal",    c: { body:"#3B3A37", batten:"#3B3A37", trim:"#F0ECE3", door:"#31302D", glass:"#7E939E", roof:"#2B2926", curb:"#26251F", tread:"#31302D", riser:"#31302D" } },
  { name: "Warm greige", c: { body:"#A99C8B", batten:"#A99C8B", trim:"#F0ECE3", door:"#2B2926", glass:"#8FA3AD", roof:"#2B2926", curb:"#6B6255", tread:"#2B2926", riser:"#2B2926" } },
  { name: "Deep green",  c: { body:"#3D4A3F", batten:"#42503F", trim:"#F0ECE3", door:"#2B2926", glass:"#8FA3AD", roof:"#2B2926", curb:"#2C332B", tread:"#2B2926", riser:"#2B2926" } }
];

const COLOR_ROLES = [
  ["body",   "Siding body"],
  ["batten", "Batten / lap accent"],
  ["trim",   "Trim"],
  ["door",   "Doors"],
  ["glass",  "Glass"],
  ["tread",  "Stair tread"],
  ["riser",  "Stair riser"],
  ["roof",   "Roof"],
  ["curb",   "Curb"]
];

/* ===================================================================
   Geometry — derived from CONFIG. Everything downstream reads this.
   =================================================================== */

function geometry(cfg) {
  const S = cfg.pxPerFt;
  const ft = f => f * S;
  const inch = i => (i / 12) * S;

  const wallW = ft(cfg.widthFt);
  const wallH = ft(cfg.wallHeightFt);
  const ridgeRise = ft(cfg.depthFt / 2) * (cfg.pitch / 12);
  const fascia = ft(0.9);
  const OH = inch(cfg.overhangInches);
  const curb = inch(cfg.curbInches);

  // The ground sits at a fixed height, reserved for a "decent max" wall
  // height + roof pitch, rather than being computed forward from a fixed
  // sky headroom — so growing the wall or steepening the pitch pushes the
  // roofline up into that reserved space instead of growing the picture
  // itself (and the sky) taller. Only a genuinely extreme combination of
  // sliders would exceed the reserve and get cropped at the top.
  const groundY = ft(28);
  const wallTopY = groundY - wallH;
  const eaveY = wallTopY - fascia;
  const ridgeY = eaveY - ridgeRise;
  const H = groundY + 74;

  const x0 = 46;
  const x1 = x0 + wallW;

  // door openings, laid out left to right from the corner return
  const doors = [];
  let cur = x0 + ft(cfg.cornerReturnFt);
  cfg.doorWidths.forEach((w, i) => {
    doors.push([cur, cur + ft(w)]);
    cur += ft(w) + (i < cfg.doorWidths.length - 1 ? ft(cfg.pierFt) : 0);
  });

  const stairW = ft(cfg.stairWidthFt);
  // switchback flights sit as close together as the rail posts allow
  const stairFootprintW = cfg.stairStyle === "switchback"
    ? stairW * 2 + ft(STAIR_RAIL_GAP_FT)
    : stairW;
  const stairCx = x1 + ft(0.5) + stairFootprintW / 2;
  const houseX = x1 + ft(cfg.houseGapFt);
  const W = cfg.showHouse ? houseX + 96 : Math.max(x1 + ft(2), stairCx + stairFootprintW / 2) + 40;

  return { S, ft, inch, x0, x1, wallW, wallH, ridgeRise, fascia, OH, curb,
           ridgeY, eaveY, wallTopY, groundY, doors, stairCx, stairW, stairFootprintW, houseX, W, H };
}

/* ===================================================================
   Drawing helpers
   =================================================================== */

const esc = s => String(s);
const rect = (x, y, w, h, f) =>
  `<rect x="${esc(x)}" y="${esc(y)}" width="${esc(w)}" height="${esc(h)}" fill="${f}"/>`;
const poly = (pts, f) => `<polygon points="${pts}" fill="${f}"/>`;

function sidingPattern(id, kind, g) {
  if (kind === "bb") {
    const p = g.ft(1.35), b = g.ft(0.3);
    return `<pattern id="${id}" width="${p}" height="600" patternUnits="userSpaceOnUse">
      <rect width="${p}" height="600" fill="var(--body)"/>
      <rect width="${b}" height="600" fill="var(--batten)"/>
      <rect x="${b}" width="1.3" height="600" fill="rgba(0,0,0,0.13)"/></pattern>`;
  }
  if (kind === "panel") {
    // wide flat sheet panels (T1-11 style) — a deep groove every 2', no batten
    const p = g.ft(2);
    return `<pattern id="${id}" width="${p}" height="600" patternUnits="userSpaceOnUse">
      <rect width="${p}" height="600" fill="var(--body)"/>
      <rect x="${p - 3}" width="3" height="600" fill="rgba(0,0,0,0.28)"/>
      <rect x="${p - 6}" width="1.5" height="600" fill="rgba(0,0,0,0.10)"/></pattern>`;
  }
  if (kind === "shake") {
    // staggered cedar shake courses, alternating tone per tile
    const tw = g.ft(0.75), th = g.ft(0.6);
    return `<pattern id="${id}" width="${tw * 2}" height="${th}" patternUnits="userSpaceOnUse">
      <rect width="${tw * 2}" height="${th}" fill="var(--body)"/>
      <rect x="1" y="1.5" width="${tw - 2}" height="${th - 7}" fill="var(--batten)"/>
      <rect x="${tw + 1}" y="1.5" width="${tw - 2}" height="${th - 7}" fill="var(--body)"/>
      <rect y="${th - 5}" width="${tw * 2}" height="5" fill="rgba(0,0,0,0.22)"/></pattern>`;
  }
  if (kind === "vinyl") {
    // vinyl double-4" lap — a tighter reveal than wood/fiber-cement lap,
    // with a lighter shadow line since panels butt flush (no wood grain)
    const h = g.ft(4.5 / 12);
    return `<pattern id="${id}" width="600" height="${h}" patternUnits="userSpaceOnUse">
      <rect width="600" height="${h}" fill="var(--body)"/>
      <rect y="${h - 1}" width="600" height="1" fill="rgba(0,0,0,0.11)"/></pattern>`;
  }
  const h = g.ft(0.67);
  return `<pattern id="${id}" width="600" height="${h}" patternUnits="userSpaceOnUse">
    <rect width="600" height="${h}" fill="var(--body)"/>
    <rect y="${h - 1.3}" width="600" height="1.3" fill="rgba(0,0,0,0.15)"/></pattern>`;
}

function brickPattern(id) {
  return `<pattern id="${id}" width="40" height="13" patternUnits="userSpaceOnUse">
    <rect width="40" height="13" fill="#A5503C"/>
    <rect width="40" height="1.8" y="11.2" fill="#8B4231"/>
    <rect width="1.8" height="13" fill="#8B4231"/>
    <rect width="1.8" height="13" x="20" fill="#9A4A37"/></pattern>`;
}

/* one overhead door with a glazed top section */
function overheadDoor(a, b, g, cfg) {
  const top = g.groundY - g.ft(cfg.doorHeightFt);
  const w = b - a, secH = (g.groundY - top) / 4;
  let s = rect(a, top, w, g.groundY - top, "var(--door)");

  const lites = Math.max(2, Math.round(w / g.ft(3.2)));
  const pad = 8, iw = (w - pad * 2) / lites;
  for (let i = 0; i < lites; i++) {
    s += rect(a + pad + i * iw + 2.5, top + 5, iw - 5, secH - 10, "var(--glass)");
    s += rect(a + pad + i * iw + 2.5, top + 5, iw - 5, 1.6, "rgba(255,255,255,0.28)");
  }
  for (let k = 1; k < 4; k++) s += rect(a, top + k * secH - 1, w, 1.8, "rgba(0,0,0,0.22)");
  for (let m = 1; m < 4; m++) {
    const py = top + m * secH;
    s += rect(a + 7, py + 6, w - 14, 1.2, "rgba(0,0,0,0.10)");
    s += rect(a + 7, py + secH - 8, w - 14, 1.2, "rgba(0,0,0,0.10)");
  }
  // casing
  const trim = g.inch(cfg.doorTrimIn);
  s += rect(a - trim, top - trim, w + trim * 2, trim, "var(--trim)");
  s += rect(a - trim, top - trim, trim, g.groundY - top + trim, "var(--trim)");
  s += rect(b, top - trim, trim, g.groundY - top + trim, "var(--trim)");
  return s;
}

// shed dormers are drawn head-on, so their shallow roof (which slopes
// front-to-back, not side-to-side) reads as a flat cap of this height
// rather than a triangular peak — there's no ridge line to draw in elevation.
const DORMER_SHED_CAP_FT = 1.3;

// switchback flights sit as close together as possible, but still need
// this much clearance between them or their inner handrail posts collide
const STAIR_RAIL_GAP_FT = 1;

/* gable dormer sitting on the front roof slope */
function dormer(cx, widthFt, g, cfg, uid) {
  const hw = g.ft(widthFt) / 2;
  const base = g.eaveY - 6;
  const wallH = g.ft(cfg.dormerWallFt);
  const wallT = base - wallH;
  const peak = wallT - g.ft(widthFt / 2) * (cfg.pitch / 12);

  let s = poly(`${cx - hw - 7},${wallT + 5} ${cx},${peak} ${cx + hw + 7},${wallT + 5}`, "var(--roof)");
  // siding fills the whole gable field, cropped by the roofline itself —
  // its peak matches the roof's own apex so no sliver of bare roof shows above it
  s += poly(
    `${cx - hw},${base} ${cx - hw},${wallT} ${cx},${peak} ${cx + hw},${wallT} ${cx + hw},${base}`,
    `url(#sd${uid})`);
  // thin rake trim along the roof edge — a stroke, not a filled triangle,
  // so it caps the gable without hiding the siding underneath it
  s += `<polyline points="${cx - hw - 4},${wallT + 9} ${cx},${peak} ${cx + hw + 4},${wallT + 9}" fill="none" stroke="var(--trim)" stroke-width="7" stroke-linejoin="round"/>`;
  s += rect(cx - hw, wallT, 6, base - wallT, "var(--trim)");
  s += rect(cx + hw - 6, wallT, 6, base - wallT, "var(--trim)");
  s += rect(cx - hw, base - 4, hw * 2, 4, "var(--trim)");

  const ww = Math.min(hw * 2 - 26, g.ft(widthFt > 7 ? 5.8 : 2.5));
  // leave an apron of solid wall below the sill — without it the window
  // trim ran almost to the base, making the glass look floor-mounted
  const apron = Math.max(g.inch(8), wallH * 0.22);
  const wh = wallH - 14 - apron;
  s += rect(cx - ww / 2 - 4, wallT + 7, ww + 8, wh + 8, "var(--trim)");
  s += rect(cx - ww / 2, wallT + 11, ww, wh, "var(--glass)");
  s += rect(cx - ww / 2, wallT + 11, ww, 1.8, "rgba(255,255,255,0.26)");
  const mull = widthFt > 7 ? 3 : 1;
  for (let i = 1; i <= mull; i++) {
    s += rect(cx - ww / 2 + (ww / (mull + 1)) * i - 1, wallT + 11, 2, wh, "var(--trim)");
  }
  s += rect(cx - hw - 7, base, hw * 2 + 14, 3.5, "rgba(0,0,0,0.16)");
  return s;
}

/* shed dormer sitting on the front roof slope — a flat-topped box rather
   than a gable, since its low roof slopes away from the viewer */
function shedDormer(cx, widthFt, g, cfg, uid) {
  const hw = g.ft(widthFt) / 2;
  const base = g.eaveY - 6;
  const wallH = g.ft(cfg.dormerWallFt);
  const wallT = base - wallH;
  const capT = wallT - g.ft(DORMER_SHED_CAP_FT);

  // shallow roof cap: flat across (its slope runs front-to-back, invisible
  // head-on), with a small overhang and a fascia line where it meets the wall
  let s = rect(cx - hw - 7, capT, hw * 2 + 14, wallT - capT + 6, "var(--roof)");
  s += rect(cx - hw - 7, capT, hw * 2 + 14, 1.8, "rgba(255,255,255,0.10)");
  s += rect(cx - hw - 7, wallT, hw * 2 + 14, 1.8, "rgba(0,0,0,0.18)");

  // siding wall face, with corner boards instead of gable rakes
  s += rect(cx - hw, wallT, hw * 2, base - wallT, `url(#sd${uid})`);
  s += rect(cx - hw, wallT, 6, base - wallT, "var(--trim)");
  s += rect(cx + hw - 6, wallT, 6, base - wallT, "var(--trim)");
  s += rect(cx - hw, base - 4, hw * 2, 4, "var(--trim)");

  const ww = Math.min(hw * 2 - 26, g.ft(widthFt > 7 ? 5.8 : 2.5));
  const apron = Math.max(g.inch(8), wallH * 0.22);
  const wh = wallH - 14 - apron;
  s += rect(cx - ww / 2 - 4, wallT + 7, ww + 8, wh + 8, "var(--trim)");
  s += rect(cx - ww / 2, wallT + 11, ww, wh, "var(--glass)");
  s += rect(cx - ww / 2, wallT + 11, ww, 1.8, "rgba(255,255,255,0.26)");
  const mull = widthFt > 7 ? 3 : 1;
  for (let i = 1; i <= mull; i++) {
    s += rect(cx - ww / 2 + (ww / (mull + 1)) * i - 1, wallT + 11, 2, wh, "var(--trim)");
  }
  s += rect(cx - hw - 7, base, hw * 2 + 14, 3.5, "rgba(0,0,0,0.16)");
  return s;
}

function drawDormer(cx, widthFt, g, cfg, uid) {
  return cfg.dormerStyle === "shed" ? shedDormer(cx, widthFt, g, cfg, uid) : dormer(cx, widthFt, g, cfg, uid);
}

/* one straight flight of n steps, its top tread sitting at topY, stacked
   straight on (no perspective taper) the way the whole stair is drawn. */
function stairFlight(cx, w, n, stepH, topY, g) {
  const bottomY = topY + n * stepH;
  const RH = g.ft(2.6);

  let s = rect(cx - w / 2 - 5, bottomY - 3, w + 10, 5, "rgba(0,0,0,0.16)");

  for (let i = 0; i < n; i++) {
    const y = bottomY - i * stepH;
    s += rect(cx - w / 2, y - stepH, w, stepH, "var(--riser)");
    s += rect(cx - w / 2, y - stepH, w, Math.min(g.inch(2), stepH), "var(--tread)");
    s += rect(cx - w / 2, y - stepH, w, 2.2, "rgba(255,255,255,0.15)");
    s += rect(cx - w / 2, y - 2.2, w, 2.2, "rgba(0,0,0,0.30)");
  }

  [-1, 1].forEach(k => {
    s += rect(cx + k * (w / 2) - (k > 0 ? 0 : 7), topY, 7, bottomY - topY, "var(--trim)");
    for (let p = 0; p <= n; p += 5) {
      const px = cx + k * (w / 2 + 3.5), py = bottomY - p * stepH;
      s += rect(px - 1.7, py - RH, 3.4, RH, "var(--trim)");
    }
    s += rect(cx + k * (w / 2 + 1) - (k > 0 ? 0 : 6), topY - RH, 6, bottomY - topY, "var(--trim)");
  });

  s += rect(cx - w / 2 - 6, topY - 3, w + 12, 5, "var(--trim)");
  return s;
}

/* a walkway carrying the top of the stair over to the wall it's climbing
   toward, on posts rather than a solid wall, since (with the flights
   flipped) it may run over the top of the other flight below it. */
function stairWalkway(xLeft, xRight, y, thick, g) {
  const width = xRight - xLeft;
  if (width <= 0.5) return "";
  const RH = g.ft(2.6);
  let s = rect(xLeft, y - 3, width, 5, "var(--trim)");
  s += rect(xLeft, y - thick, width, thick, "var(--tread)");
  const postGap = g.ft(4);
  for (let x = xLeft + postGap / 2; x < xRight; x += postGap) {
    s += rect(x - 3, y, 6, g.groundY - y, "var(--trim)");
  }
  // handrail running the length of the walkway, matching the flights' own
  const balusterGap = g.ft(1.5);
  for (let x = xLeft + balusterGap / 2; x < xRight; x += balusterGap) {
    s += rect(x - 1.7, y - RH, 3.4, RH, "var(--trim)");
  }
  s += rect(xLeft, y - RH - 3, width, 5, "var(--trim)");
  return s;
}

/* a full-height structural post, ground to wall-top, regardless of how
   tall the flight(s) next to it happen to be at that x position */
function stairSupportPost(x, g) {
  return rect(x - 3.5, g.wallTopY, 7, g.groundY - g.wallTopY, "var(--trim)");
}

/* exterior stair running front-to-back along the gable wall, drawn straight
   on (no perspective taper) so it stays inline with the garage side wall.
   "switchback" splits the run into two flights side by side, sharing a
   landing exactly as wide as the two flights combined, folding the total
   depth the stair needs roughly in half. switchbackFlip swaps which
   flight sits nearer the wall. */
function stairs(g, cfg) {
  const rise = g.groundY - g.wallTopY;
  const n = Math.max(2, Math.round(g.ft(cfg.wallHeightFt) / g.inch(cfg.riserInches)));
  const stepH = rise / n;
  const w = g.ft(cfg.stairWidthFt);
  const treadCap = Math.min(g.inch(2), stepH);

  if (cfg.stairStyle !== "switchback") {
    let s = stairFlight(g.stairCx, w, n, stepH, g.wallTopY, g);
    s += stairWalkway(g.x1, g.stairCx - w / 2, g.wallTopY, treadCap, g);
    s += stairSupportPost(g.stairCx - w / 2, g);
    s += stairSupportPost(g.stairCx + w / 2, g);
    return s;
  }

  const lowerN = Math.min(Math.max(Math.round(cfg.lowerFlightSteps), 1), n - 1);
  const upperN = n - lowerN;
  const gap = g.ft(STAIR_RAIL_GAP_FT);
  const insideCx = g.stairCx - (gap / 2 + w / 2);   // nearer the wall
  const outsideCx = g.stairCx + (gap / 2 + w / 2);  // farther from the wall
  const lowerCx = cfg.switchbackFlip ? outsideCx : insideCx;
  const upperCx = cfg.switchbackFlip ? insideCx : outsideCx;
  const landingY = g.groundY - lowerN * stepH;

  let s = stairFlight(lowerCx, w, lowerN, stepH, landingY, g);
  s += stairFlight(upperCx, w, upperN, stepH, g.wallTopY, g);

  // top landing carrying the stair over to the wall it climbs toward — a
  // walkway rather than a solid deck, since when the upper flight sits on
  // the outside this runs over the top of the lower flight below it
  s += stairWalkway(g.x1, upperCx - w / 2, g.wallTopY, treadCap, g);

  // full-height posts at the two outer extremes of the whole structure:
  // the wall-facing edge of the inside flight, and the outside edge of the
  // outside flight — the same spots the flights' own corner posts already
  // mark, just carried the full height instead of only their own flight's
  s += stairSupportPost(insideCx - w / 2, g);
  s += stairSupportPost(outsideCx + w / 2, g);
  return s;
}

/* dormerCount as actually usable: 2 requires exactly 2 doors to anchor to,
   otherwise it falls back to a single positioned dormer. */
function effectiveDormerCount(cfg) {
  if (cfg.dormerCount === 2 && cfg.doorWidths.length === 2) return 2;
  return Math.min(cfg.dormerCount, 1);
}

/* ===================================================================
   The elevation
   =================================================================== */

function drawGarage(cfg, uid) {
  const g = geometry(cfg);
  let s = "";

  s += `<defs>${sidingPattern("sd" + uid, cfg.siding, g)}${brickPattern("bk" + uid)}</defs>`;

  // ground and sky
  s += rect(0, 0, g.W, g.groundY, "var(--sky)");
  s += rect(0, g.groundY, g.W, g.H - g.groundY, "var(--grass)");
  s += rect(14, g.groundY, g.x1 + g.ft(6), g.H - g.groundY, "var(--drive)");
  s += rect(14, g.groundY, g.x1 + g.ft(6), 2, "rgba(0,0,0,0.12)");

  // the house across the gap, for color reference — a fixed height of its
  // own, independent of the garage's wall height/pitch/depth, anchored
  // only to the shared ground line
  if (cfg.showHouse) {
    const houseEaveY = g.groundY - g.ft(20);   // roughly a 2-story eave height
    s += rect(g.houseX, houseEaveY, g.W - g.houseX, g.groundY - houseEaveY, `url(#bk${uid})`);
    s += rect(g.houseX, houseEaveY, 6, g.groundY - houseEaveY, "rgba(0,0,0,0.20)");
    s += rect(g.houseX, houseEaveY - 18, g.W - g.houseX, 20, "#F1EDE5");
    s += rect(g.houseX, houseEaveY - 28, g.W - g.houseX, 11, "#31302E");
  }

  // stairs are drawn before the roof/fascia so their top tucks behind the eave
  if (cfg.showStairs) s += stairs(g, cfg);

  // roof: ridge parallel to the door wall, front slope in view
  const RL = g.x0 - g.OH, RR = g.x1 + g.OH;
  s += rect(RL, g.ridgeY, RR - RL, g.eaveY - g.ridgeY, "var(--roof)");
  for (let cy = g.ridgeY + 10; cy < g.eaveY - 2; cy += 10) {
    s += rect(RL, cy, RR - RL, 1.3, "rgba(255,255,255,0.055)");
    s += rect(RL, cy + 1.3, RR - RL, 0.9, "rgba(0,0,0,0.13)");
  }
  s += rect(RL, g.ridgeY - 6, RR - RL, 8, "var(--roof)");
  s += rect(RL, g.ridgeY - 6, RR - RL, 1.8, "rgba(255,255,255,0.10)");

  // dormers — 2 centers one over each door (only when there are exactly 2
  // doors to anchor to), otherwise a single dormer positioned left/center/right
  if (cfg.showDormers) {
    const count = effectiveDormerCount(cfg);
    if (count === 2) {
      g.doors.forEach((d, i) => {
        const w = cfg.dormerWidths[i];
        if (w > 0) s += drawDormer((d[0] + d[1]) / 2, w, g, cfg, uid);
      });
    } else if (count === 1) {
      const w = cfg.dormerWidths[0];
      if (w > 0) {
        const hw = g.ft(w) / 2;
        const center = (RL + RR) / 2;
        const inset = g.ft(cfg.dormerEdgeMarginFt) + hw;
        let cx = center;
        if (cfg.dormerPosition === "left") {
          const edgeCx = RL + inset;
          cx = Math.min(edgeCx + g.ft(cfg.dormerOffsetFt), center);
        } else if (cfg.dormerPosition === "right") {
          const edgeCx = RR - inset;
          cx = Math.max(edgeCx - g.ft(cfg.dormerOffsetFt), center);
        }
        s += drawDormer(cx, w, g, cfg, uid);
      }
    }
  }

  // wall
  s += rect(g.x0, g.wallTopY, g.wallW, g.groundY - g.curb - g.wallTopY, `url(#sd${uid})`);

  // block curb, interrupted by the openings
  let curbX = g.x0;
  g.doors.forEach(d => {
    s += rect(curbX, g.groundY - g.curb, d[0] - curbX, g.curb, "var(--curb)");
    curbX = d[1];
  });
  s += rect(curbX, g.groundY - g.curb, g.x1 - curbX, g.curb, "var(--curb)");

  // doors
  g.doors.forEach(d => { s += overheadDoor(d[0], d[1], g, cfg); });

  // corner boards
  s += rect(g.x0, g.wallTopY, 11, g.groundY - g.curb - g.wallTopY, "var(--trim)");
  s += rect(g.x1 - 11, g.wallTopY, 11, g.groundY - g.curb - g.wallTopY, "var(--trim)");

  // fascia, soffit, gutter
  s += rect(RL, g.eaveY, RR - RL, g.fascia, "var(--trim)");
  s += rect(RL, g.eaveY, RR - RL, 1.8, "rgba(0,0,0,0.22)");
  s += rect(RL, g.wallTopY - 4, RR - RL, 4, "var(--trim)");
  s += rect(g.x0 - 2, g.wallTopY, g.wallW + 4, 4, "rgba(0,0,0,0.15)");

  // Site colors are pinned on the <svg> itself (not inherited from the page)
  // so a saved .svg still renders correctly on its own.
  const site = { sky: "#CBD8DF", grass: "#8C9A72", drive: "#C6C2BB" };
  const vars = Object.entries({ ...cfg.colors, ...site })
    .map(([k, v]) => `--${k}:${v}`).join(";");
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${Math.round(g.W)} ${Math.round(g.H)}" style="${vars}">${s}</svg>`;
}

/* ===================================================================
   Checks — the numbers that decide whether the drawing is buildable
   =================================================================== */

function runChecks(cfg) {
  const out = [];
  const n = cfg.doorWidths.length;

  const used = 2 * cfg.cornerReturnFt + cfg.pierFt * (n - 1) +
               cfg.doorWidths.reduce((a, b) => a + b, 0);
  const left = cfg.widthFt - used;
  out.push({
    ok: Math.abs(left) < 0.01,
    label: "Wall accounted for",
    value: left === 0 ? "exact" : (left > 0 ? `${left.toFixed(1)}' spare` : `${(-left).toFixed(1)}' over`)
  });

  // headroom band at 7'-6"
  const half = cfg.depthFt / 2;
  const xAt = 7.5 / (cfg.pitch / 12);
  const band = xAt < half ? 2 * (half - xAt) : 0;
  out.push({
    ok: band >= 5,
    label: "Band at 7'-6\" headroom",
    value: band > 0 ? `${band.toFixed(1)}' wide` : "none"
  });

  // ridge height above plate
  const ridgeFt = half * (cfg.pitch / 12);
  out.push({ ok: true, label: "Ridge above plate", value: `${ridgeFt.toFixed(1)}'` });

  // dormer clearance under the ridge
  if (cfg.showDormers) {
    const count = effectiveDormerCount(cfg);
    const widths = count === 2 ? cfg.dormerWidths : cfg.dormerWidths.slice(0, count);
    widths.forEach((w, i) => {
      if (!w) return;
      const peak = cfg.dormerStyle === "shed"
        ? cfg.dormerWallFt + DORMER_SHED_CAP_FT
        : cfg.dormerWallFt + (w / 2) * (cfg.pitch / 12);
      const clear = ridgeFt - peak;
      out.push({
        ok: clear >= 1.5,
        label: `Dormer ${i + 1} (${w}') under ridge`,
        value: `${(clear * 12).toFixed(0)}"`
      });
    });
  }

  // stair run against the depth available
  if (cfg.showStairs) {
    const risers = Math.round((cfg.wallHeightFt * 12) / cfg.riserInches);
    if (cfg.stairStyle === "switchback") {
      const lowerN = Math.min(Math.max(Math.round(cfg.lowerFlightSteps), 1), risers - 1);
      const longFlight = Math.max(lowerN, risers - lowerN);
      const run = longFlight * cfg.treadInches / 12 + cfg.stairWidthFt;
      out.push({
        ok: run <= cfg.depthFt - 3,
        label: `Stair run (${risers} risers, switchback)`,
        value: `${run.toFixed(1)}' in ${cfg.depthFt}'`
      });
    } else {
      const run = risers * cfg.treadInches / 12;
      out.push({
        ok: run <= cfg.depthFt - 3,
        label: `Stair run (${risers} risers)`,
        value: `${run.toFixed(1)}' in ${cfg.depthFt}'`
      });
    }
  }

  return out;
}

const FIELDS_BUILDING_DIMENSIONS = [
  ["widthFt", "Width (ft)", 8, 80, 1],
  ["depthFt", "Depth (ft)", 8, 60, 1],
  ["wallHeightFt", "Wall height (ft)", 7, 20, 0.5],
  ["pitch", "Pitch (/12)", 2, 16, 1]
];
const FIELDS_BUILDING_ROOF = [
  ["overhangInches", "Overhang (in)", 0, 36, 1],
  ["curbInches", "Curb (in)", 0, 24, 1]
];
const FIELDS_BUILDING_SITE = [
  ["houseGapFt", "Gap to house (ft)", 4, 60, 1],
  ["pxPerFt", "Scale (px/ft)", 6, 40, 1]
];

const FIELDS_DOORS = [
  ["door0", "Door 1 (ft)", 6, 24, 1],
  ["door1", "Door 2 (ft)", 0, 24, 1],
  ["doorTrimIn", "Door trim (in)", 2, 10, 0.5]

const FIELDS_FRAMING = [
  ["cornerReturnFt", "Corner return (ft)", 0.5, 10, 0.5],

];
const FIELDS_DORMERS = [
  ["dormer0", "Dormer 1 (ft)", 0, 20, 1],
  ["dormer1", "Dormer 2 (ft)", 0, 20, 1],
  ["dormerWallFt", "Dormer wall (ft)", 2, 8, 0.5]
];
const FIELDS_DORMER_POSITION = [
  ["dormerOffsetFt", "Dormer offset (ft)", 0, 20, 0.5],
  ["dormerEdgeMarginFt", "Dormer edge margin (ft)", 0, 8, 0.5]
];
const FIELDS_STAIRS = [
  ["stairWidthFt", "Stair width (ft)", 3, 8, 0.5],
  ["riserInches", "Riser height (in)", 5, 8, 0.25],
  ["treadInches", "Tread run (in)", 9, 14, 0.5]
];
const FIELDS_STAIRS_SWITCHBACK = [
  ["lowerFlightSteps", "Lower flight steps", 1, 30, 1]
];

function readVirtual(key) {
  if (key === "door0") return CONFIG.doorWidths[0];
  if (key === "door1") return CONFIG.doorWidths[1] ?? 0;
  if (key === "dormer0") return CONFIG.dormerWidths[0];
  if (key === "dormer1") return CONFIG.dormerWidths[1] ?? 0;
  return CONFIG[key];
}

function writeVirtual(key, v) {
  if (key === "door0") { CONFIG.doorWidths[0] = v; return; }
  if (key === "door1") {
    if (v > 0) { CONFIG.doorWidths[1] = v; CONFIG.dormerWidths[1] = CONFIG.dormerWidths[1] ?? 0; }
    else { CONFIG.doorWidths.length = 1; CONFIG.dormerWidths.length = 1; }
    return;
  }
  if (key === "dormer0") { CONFIG.dormerWidths[0] = v; return; }
  if (key === "dormer1") { CONFIG.dormerWidths[1] = v; return; }
  CONFIG[key] = v;
}

function buildControls(hostId, fields) {
  const host = document.getElementById(hostId);
  fields.forEach(([key, label, min, max, step]) => {
    const l = document.createElement("label");
    l.innerHTML = `<span>${label}</span>`;
    const inp = document.createElement("input");
    inp.type = "number";
    inp.id = "fld-" + key;
    inp.min = min; inp.max = max; inp.step = step;
    inp.value = readVirtual(key);
    inp.addEventListener("input", () => {
      const v = parseFloat(inp.value);
      if (!Number.isNaN(v)) { writeVirtual(key, v); render(); }
    });
    l.appendChild(inp);
    host.appendChild(l);
  });
}

function refreshField(key) {
  const inp = document.getElementById("fld-" + key);
  if (inp) inp.value = readVirtual(key);
}

function buildButton(hostId, label, onClick) {
  const host = document.getElementById(hostId);
  const l = document.createElement("label");
  l.innerHTML = `<span>&nbsp;</span>`;
  const btn = document.createElement("button");
  btn.type = "button";
  btn.textContent = label;
  btn.addEventListener("click", onClick);
  l.appendChild(btn);
  host.appendChild(l);
}

function buildSwapDoorsButton() {
  buildButton("ctlDoors", "Swap doors", () => {
    CONFIG.doorWidths.reverse();
    refreshField("door0"); refreshField("door1");
    render();
  });
}

function buildSwapDormersButton() {
  buildButton("ctlDoors", "Swap dormers", () => {
    CONFIG.dormerWidths.reverse();
    refreshField("dormer0"); refreshField("dormer1");
    render();
  });
}

function buildDoorHeightSelect() {
  const host = document.getElementById("ctlDoors");
  const l = document.createElement("label");
  l.innerHTML = `<span>Door height (ft)</span>`;
  const sel = document.createElement("select");
  sel.innerHTML = `<option value="8">8'</option><option value="9">9'</option>`;
  // snap to the nearest supported height (handles values loaded from an old share link)
  CONFIG.doorHeightFt = Math.abs(CONFIG.doorHeightFt - 9) < Math.abs(CONFIG.doorHeightFt - 8) ? 9 : 8;
  sel.value = String(CONFIG.doorHeightFt);
  sel.addEventListener("change", () => { CONFIG.doorHeightFt = parseFloat(sel.value); render(); });
  l.appendChild(sel);
  host.appendChild(l);
}

let dormerCountSelect = null;

function buildDormerCountSelect() {
  const host = document.getElementById("ctlDoors");
  const l = document.createElement("label");
  l.innerHTML = `<span>Dormers</span>`;
  const sel = document.createElement("select");
  sel.innerHTML = `<option value="0">None</option><option value="1">One</option><option value="2">Two, over doors</option>`;
  sel.value = String(CONFIG.dormerCount);
  sel.addEventListener("change", () => { CONFIG.dormerCount = parseInt(sel.value, 10); render(); });
  l.appendChild(sel);
  host.appendChild(l);
  dormerCountSelect = sel;
}

function refreshDormerCountSelect() {
  if (!dormerCountSelect) return;
  const twoDoorsOK = CONFIG.doorWidths.length === 2;
  const twoOption = dormerCountSelect.querySelector('option[value="2"]');
  twoOption.disabled = !twoDoorsOK;
  if (!twoDoorsOK && CONFIG.dormerCount === 2) CONFIG.dormerCount = 1;
  dormerCountSelect.value = String(CONFIG.dormerCount);
}

function buildDormerStyleSelect() {
  const host = document.getElementById("ctlDoors");
  const l = document.createElement("label");
  l.innerHTML = `<span>Dormer style</span>`;
  const sel = document.createElement("select");
  sel.innerHTML = `<option value="gable">Gable</option><option value="shed">Shed</option>`;
  sel.value = CONFIG.dormerStyle;
  sel.addEventListener("change", () => { CONFIG.dormerStyle = sel.value; render(); });
  l.appendChild(sel);
  host.appendChild(l);
}

function buildStairStyleSelect() {
  const host = document.getElementById("ctlStairs");
  const l = document.createElement("label");
  l.innerHTML = `<span>Stair style</span>`;
  const sel = document.createElement("select");
  sel.innerHTML = `<option value="straight">Straight</option><option value="switchback">Switchback</option>`;
  sel.value = CONFIG.stairStyle;
  sel.addEventListener("change", () => { CONFIG.stairStyle = sel.value; render(); });
  l.appendChild(sel);
  host.appendChild(l);
}

function buildDormerPositionSelect() {
  const host = document.getElementById("ctlDoors");
  const l = document.createElement("label");
  l.innerHTML = `<span>Dormer position</span>`;
  const sel = document.createElement("select");
  sel.innerHTML = `<option value="left">Left</option><option value="center">Center</option><option value="right">Right</option>`;
  sel.value = CONFIG.dormerPosition;
  sel.addEventListener("change", () => { CONFIG.dormerPosition = sel.value; render(); });
  l.appendChild(sel);
  host.appendChild(l);
}

function buildToggle(hostId, key, label) {
  const host = document.getElementById(hostId);
  const l = document.createElement("label");
  l.innerHTML = `<span>&nbsp;</span>`;
  const row = document.createElement("span");
  row.className = "check-row";
  const inp = document.createElement("input");
  inp.type = "checkbox";
  inp.checked = CONFIG[key];
  inp.addEventListener("change", () => { CONFIG[key] = inp.checked; render(); });
  row.appendChild(inp);
  row.appendChild(document.createTextNode(label));
  l.appendChild(row);
  host.appendChild(l);
}

/* Share links — see shared.js for the codec itself. This schema is
   page-specific: it lists CONFIG's fields, their short wire codes, and
   how to (de)serialize each one. Once a code has shipped, never reassign
   it to a different field — mint a new code instead; it's safe to add,
   remove, or reorder entries here freely. */
const SHARE_SCHEMA = {
  widthFt:        { code: "wf",  type: "num" },
  depthFt:        { code: "df",  type: "num" },
  wallHeightFt:   { code: "wh",  type: "num" },
  pitch:          { code: "pi",  type: "num" },
  doorWidths:     { code: "dw",  type: "numArr" },
  doorHeightFt:   { code: "dh",  type: "num" },
  doorTrimIn:     { code: "dt",  type: "num" },
  cornerReturnFt: { code: "cr",  type: "num" },
  pierFt:         { code: "pf",  type: "num" },
  curbInches:     { code: "ci",  type: "num" },
  overhangInches: { code: "oh",  type: "num" },
  showDormers:    { code: "sd",  type: "bool" },
  dormerStyle:    { code: "dst", type: "str" },
  dormerCount:    { code: "dc",  type: "num" },
  dormerPosition: { code: "dp",  type: "str" },
  dormerOffsetFt: { code: "dof", type: "num" },
  dormerEdgeMarginFt: { code: "dem", type: "num" },
  dormerWidths:   { code: "dmw", type: "numArr" },
  dormerWallFt:   { code: "dwf", type: "num" },
  showStairs:     { code: "ss",  type: "bool" },
  stairStyle:     { code: "sst", type: "str" },
  stairWidthFt:   { code: "sw",  type: "num" },
  riserInches:    { code: "ri",  type: "num" },
  treadInches:    { code: "ti",  type: "num" },
  lowerFlightSteps: { code: "lfs", type: "num" },
  switchbackFlip: { code: "sbf", type: "bool" },
  showHouse:      { code: "sh",  type: "bool" },
  houseGapFt:     { code: "hg",  type: "num" },
  pxPerFt:        { code: "px",  type: "num" },
  siding:         { code: "sid", type: "str" },
  colors:         { code: "col", type: "colors" }
};
const COLOR_KEYS = COLOR_ROLES.map(([k]) => k);
const share = createShareLink(CONFIG, SHARE_SCHEMA, COLOR_KEYS);

function render() {
  refreshDormerCountSelect();

  // checks
  const cs = document.getElementById("checks");
  cs.innerHTML = runChecks(CONFIG).map(c =>
    `<div class="chk ${c.ok ? "ok" : "warn"}"><span class="dot"></span>` +
    `<span><span class="lbl">${c.label}</span> <b>${c.value}</b></span></div>`
  ).join("");

  // drawing
  const out = document.getElementById("out");
  out.innerHTML = "";
  const sidingName = SIDING_TYPES.find(t => t.id === CONFIG.siding)?.name ?? CONFIG.siding;
  const svg = drawGarage(CONFIG, "s0");

  const wrap = document.createElement("div");
  wrap.className = "scheme";

  const shead = document.createElement("div");
  shead.className = "shead";
  shead.innerHTML = `<h3>Elevation</h3><span class="mat">${sidingName}</span>`;
  shead.appendChild(buildElevationActions({
    getSvg: () => svg,
    filenames: { svg: "garage-elevation.svg", png: "garage-elevation.png" },
    updateURL: share.updateURL
  }));

  const art = document.createElement("div");
  art.className = "art";
  art.innerHTML = svg;
  attachImageContextMenu(art, { getSvg: () => svg, filename: "garage-elevation.png", updateURL: share.updateURL });

  wrap.appendChild(shead);
  wrap.appendChild(art);
  out.appendChild(wrap);

  share.afterRender();
}

share.loadFromURL();

insertFieldGroup("ctlBuilding", "Dimensions");
buildControls("ctlBuilding", FIELDS_BUILDING_DIMENSIONS);
insertFieldGroup("ctlBuilding", "Roof & foundation");
buildControls("ctlBuilding", FIELDS_BUILDING_ROOF);
insertFieldGroup("ctlBuilding", "Site & scale");
buildControls("ctlBuilding", FIELDS_BUILDING_SITE);

insertFieldGroup("ctlDoors", "Doors");
buildControls("ctlDoors", FIELDS_DOORS);
buildDoorHeightSelect();
buildSwapDoorsButton();
insertFieldGroup("ctlDoors", "Framing");
buildControls("ctlDoors", FIELDS_FRAMING);
insertFieldGroup("ctlDoors", "Dormers");
buildDormerCountSelect();
buildDormerStyleSelect();
buildDormerPositionSelect();
buildControls("ctlDoors", FIELDS_DORMERS);
buildControls("ctlDoors", FIELDS_DORMER_POSITION);
buildSwapDormersButton();
buildToggle("ctlDoors", "showDormers", "Dormers");
insertFieldGroup("ctlDoors", "Site");
buildToggle("ctlDoors", "showHouse", "Show house");

insertFieldGroup("ctlStairs", "Stairs");
buildStairStyleSelect();
buildControls("ctlStairs", FIELDS_STAIRS);
insertFieldGroup("ctlStairs", "Switchback");
buildControls("ctlStairs", FIELDS_STAIRS_SWITCHBACK);
buildToggle("ctlStairs", "switchbackFlip", "Lower flight outside");
buildToggle("ctlStairs", "showStairs", "Stairs");

buildAppearanceSection({
  paletteHostId: "ctlAppearance",
  swatchHostId: "ctlColors",
  palettes: PALETTES,
  colorRoles: COLOR_ROLES,
  config: CONFIG,
  onChange: render,
  namespace: "garage",
  exportName: "garage-palette.png",
  getExportExtra: () => ({ Siding: SIDING_TYPES.find(t => t.id === CONFIG.siding)?.name ?? CONFIG.siding }),
  extra(host) {
    const sidingLabel = document.createElement("label");
    sidingLabel.innerHTML = `<span>Siding type</span>`;
    const sidingSel = document.createElement("select");
    sidingSel.innerHTML = SIDING_TYPES.map(t => `<option value="${t.id}">${t.name}</option>`).join("");
    sidingSel.value = CONFIG.siding;
    sidingSel.addEventListener("change", () => { CONFIG.siding = sidingSel.value; render(); });
    sidingLabel.appendChild(sidingSel);
    host.appendChild(sidingLabel);
  }
});
initTabs();
render();
</script>
